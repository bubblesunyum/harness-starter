            : [...document.querySelectorAll('.card')].find((c) => c.dataset.bead === id)
        if (!card) return ''
        return card.closest('[data-lane]')?.dataset.lane || (card.closest('#backlogStrip') ? 'backlog' : '')
      }

      document.addEventListener('mousedown', (e) => {
        caretDown = e.target.closest?.('[data-expand]')
          ? {x: e.clientX, y: e.clientY}
          : null
        caretSwallowed = false
      })
      document.addEventListener('mousemove', (e) => {
        if (caretDown && Math.hypot(e.clientX - caretDown.x, e.clientY - caretDown.y) > 6) {
          caretSwallowed = true
        }
      })
      document.addEventListener('mouseup', () => (caretDown = null))

      document.addEventListener('dragstart', (e) => {
        // The press began on the caret (see caretDown above) — suppress the
        // move the card would otherwise start under it.
        if (caretDown) return e.preventDefault()
        const card = e.target.closest?.('.card[data-bead]')
        if (!card) return
        draggedId = card.dataset.bead
        draggedNode = card
        e.dataTransfer.setData('text/plain', draggedId)
        e.dataTransfer.effectAllowed = 'move'
        card.classList.add('dragging')
      })
      document.addEventListener('dragend', () => {
        if (!draggedId) return
        draggedId = null
        draggedNode = null
        clearDropState()
        lastDragEnd = Date.now()
        // A poll may have arrived mid-drag and been held; repaint now that
        // the pointer is gone so nothing stays stale.
        paintNow()
      })
      document.addEventListener('dragover', (e) => {
        const zone = e.target.closest?.('[data-drop]')
        if (!zone || !draggedId) return
        e.preventDefault()
        e.dataTransfer.dropEffect = 'move'
        zone.classList.add('drop-hint')
      })
      document.addEventListener('dragleave', (e) => {
        const zone = e.target.closest?.('[data-drop]')
        if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop-hint')
      })
      document.addEventListener('drop', (e) => {
        const zone = e.target.closest?.('[data-drop]')
        if (!zone || !draggedId) return
        e.preventDefault()
        const id = draggedId
        const to = zone.dataset.drop
        // Read before clearing: dragSourceLane prefers the node the drag
        // started from, and it is gone below.
        const from = dragSourceLane(id)
        draggedId = null
        draggedNode = null
        clearDropState()
        // dragend fires next and would repaint twice; claiming the gesture
        // here makes it a no-op there.
        lastDragEnd = Date.now()
        if (!to || from === to) return paintNow()
        fetch('beads/move', {method: 'POST', body: JSON.stringify({id, lane: to})})
          .then((r) => r.json())
          .then((r) => {
            if (!r.ok) toast(r.error || 'move failed')
            tick()
          })
          .catch(() => toast("nothing is serving this page, so the move didn't go through"))
      })

      function laneCard(l) {
        const limit = laneLimits[l.key] ?? LANE_PAGE
        const shown = l.items.slice(0, limit)
        const rest = l.items.length - shown.length
        const droppable = DROP_LANES.has(l.key)
        return `
          <details class="panel lane ${l.key}" data-lane="${esc(l.key)}" ${droppable ? `data-drop="${esc(l.key)}"` : ''} ${foldedLanes.has(l.key) ? '' : 'open'}>
            <summary>
              <span class="chev">›</span>
              <h2 class="lane-name ${l.hover ? 'hoverable' : ''}"
                  ${l.hover ? 'tabindex="0" role="note" aria-label="Stage detail"' : ''}>
                ${esc(l.label)}
                ${l.hover ? `<span class="tip" id="${l.hover}"></span>` : ''}
              </h2>
              ${l.slot ? runSlot(l.slot) : ''}
              ${
                l.key === 'ready'
                  ? `<button class="add-bead" type="button" data-add-bead title="File a bead"
                      aria-label="File a bead" aria-expanded="${composerOpen}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`
                  : ''
              }
              ${l.count !== undefined ? `<span class="n">${l.count}</span>` : ''}
            </summary>
            <div class="lane-cards">
              ${l.key === 'ready' && composerOpen ? composerHtml() : ''}
              ${
                l.key === 'ready' && !l.items.length && !composerOpen
                  ? `<p class="lane-note">nothing ready — press + to file the next thing.</p>`
                  : ''
              }
              ${l.note ? `<p class="lane-note">${esc(l.note)}</p>` : ''}
              ${renderTree(shown, l.key)}
              ${
                rest > 0
                  ? `<button class="load-more" data-more="${esc(l.key)}">
                  load ${Math.min(rest, LANE_PAGE)} more</button>`
                  : ''
              }
            </div>
          </details>`
      }

      /* ---- backlog ---------------------------------------------------------- */
      /* Filed, not offered. It sits above the board because it's the shelf the board
         draws from, and collapsed because nothing here is the next thing to do. */
      function drawBacklog(d, force = false) {
        const items = d.ledger.issues
          .filter((i) => i.backlog)
          // bd returns no meaningful order, so the strip reads down by priority —
          // otherwise "first" would change between polls.
          .sort((a, b) => a.priority - b.priority || String(a.created_at).localeCompare(String(b.created_at)))
        // Held like the board while a composer is open or a drag is in flight:
        // the strip is a drop zone, and rebuilding it mid-drag destroys the
        // source node out from under the gesture.
        if (!force && (composerOpen || draggedId)) return
        // The fingerprint is the markup, so expansion is in it for free: a
        // toggled caret repaints, and a poll that moves no bead changes nothing.
        const signature = JSON.stringify([items.map((i) => [i.id, i.title, i.priority, i.status,
          (i.labels || []).join(','), (i.children || []).join(',')]), [...expandedEpics].sort()])
        if (signature === backlogSignature) return
        backlogSignature = signature

        $('backlog').hidden = !items.length
        $('backlogCount').textContent = items.length
        // Children are named outright here, so only roots seed the trees —
        // renderTree keeps the first appearance either way.
        const inBacklog = new Set(items.map((i) => i.id))
        $('backlogStrip').innerHTML = renderTree(items.filter((i) => !inBacklog.has(i.parent)))
      }

      /* ---- work tree ---------------------------------------------------------- */
      /* Every path git status has an opinion about — the raw working copy, not the
         beads it might carry. Staged rows first, then unstaged, alphabetical within
         each: the same order `git status` reads in, which is the order a commit
         right now would actually take. */
      const UNDO_ICON = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8h7a5 5 0 1 1 0 10h-2" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 4.5 4 8l3.5 3.5" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`

      let worktree = {byPath: {}}

      // The directory is context; the filename is the thing being identified —
      // splitting them lets one read as secondary and the other as primary,
      // rather than one long string of one weight.
      function splitPath(path) {
        const i = path.lastIndexOf('/')
        return i === -1 ? {dir: '', base: path} : {dir: path.slice(0, i + 1), base: path.slice(i + 1)}
      }

      /* The work-tree row is two components, not one div shape: the identity
         (checkbox, status letter, coloured name) and the undo button. The list
         row and the diff sheet's header both compose them, each into whatever
         shell actually fits its context, rather than the header borrowing the
         row's own div and fighting its CSS. `clickable` is the one thing that
         differs between them — the header's name opens a menu, the row's doesn't. */
      function wtIdentity(e, {clickable = false} = {}) {
        const {dir, base} = splitPath(e.path)
        const label = `<span class="wt-base">${esc(base)}</span><span class="wt-dir">${esc(dir)}</span>`
        const name = clickable
          ? `<button class="wt-filename" id="sheetTitle" data-filemenu="${esc(e.path)}">${label}</button>`
          : `<span class="wt-name">${label}</span>`
        const cls = esc((e.untracked ? 'n' : e.status).toLowerCase())
        return `<input class="wt-checkbox" type="checkbox" data-stage="${esc(e.path)}"
              aria-label="Stage ${esc(e.path)}" ${e.staged ? 'checked' : ''} />
            <span class="wt-status wt-${cls}">${esc(e.untracked ? 'N' : e.status)}</span>
            ${name}`
      }

      function wtRevertButton(e) {
        return `<button class="wt-revert" data-revert="${esc(e.path)}" aria-label="Revert ${esc(e.path)}"
            title="Revert">${UNDO_ICON}</button>`
      }

      function wtRow(e) {
        return `<div class="wt-row" data-diff="${esc(e.path)}" tabindex="0" role="button"
              aria-label="View diff for ${esc(e.path)}">
          ${wtIdentity(e)}
          ${wtRevertButton(e)}
        </div>`
      }

      /* Same lane shell as a bead lane (panel/details/summary/lane-cards), so it
         gets the board's spacing, fold state, and enter/leave animation for free
         — it's rendered by `drawBoard` alongside the bead lanes rather than
         standing outside the board as its own panel. Unlike a bead lane, it
         never paginates behind `laneCard`'s load-more: the working tree is
         everything a commit right now would take, and hiding some of it behind
         a click is the one place that's actively the wrong default. */
      function worktreeLane(d) {
        const items = d.worktree || []
        return `
          <details class="panel lane worktree" data-lane="worktree" ${foldedLanes.has('worktree') ? '' : 'open'}>
            <summary>
              <span class="chev">›</span>
              <h2>work tree</h2>
              <button class="mini" type="button" data-commit-toggle
                  aria-expanded="${commitComposeOpen}" aria-controls="commitPop">commit</button>
              <span class="n">${items.length}</span>
            </summary>
            <div class="lane-cards">${items.map(wtRow).join('')}</div>
          </details>`
      }

      /* ---- markdown ---------------------------------------------------------- */
      /* marked, vendored beside this page — no CDN, no build step, no node_modules.
         A hand-rolled parser handled the simple cases and then met a numbered list
         whose items hold several paragraphs, which is most of these documents: it
         closed the list at the first blank line and restarted the count, so a
         seven-step loop rendered as step one, then steps one through six again.
         Getting that right is block-level nesting, which is the whole job. */

      /* marked passes raw HTML in the source straight through. These files are local
         and the user's own, but they're also written by an agent summarising things
         it read elsewhere, so what reaches innerHTML is rebuilt from an allowlist
         rather than trusted. An unknown element gives up its tags and keeps its text. */
      const MD_TAGS = new Set([
        'P',
        'BR',
        'HR',
        'EM',
        'STRONG',
        'DEL',
        'CODE',
        'PRE',
        'A',
        'UL',
        'OL',
        'LI',
        'BLOCKQUOTE',
        'H1',
        'H2',
        'H3',
        'H4',
        'H5',
        'H6',
        'TABLE',
        'THEAD',
        'TBODY',
        'TR',
        'TH',
        'TD',
      ])

      function sanitize(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html')
        for (const el of doc.body.querySelectorAll('*')) {
          if (!MD_TAGS.has(el.tagName)) {
            el.replaceWith(...el.childNodes)
            continue
          }
          for (const attr of [...el.attributes]) {
            // href only, and only somewhere a browser can actually go. A relative
            // link is a path on this machine: it keeps its text and loses the link
            // rather than navigating the dashboard to a 404.
            if (!(attr.name === 'href' && /^https?:\/\//i.test(attr.value))) {
              el.removeAttribute(attr.name)
            }
          }
          if (el.tagName !== 'A') continue
          if (el.getAttribute('href')) {
            el.target = '_blank'
            el.rel = 'noreferrer'
          } else el.replaceWith(...el.childNodes)
        }
        return doc.body.innerHTML
      }

      function markdown(src) {
        // Frontmatter is the file's own bookkeeping rather than prose in it: shown
        // plainly, and kept away from the parser where its `---` reads as a rule.
        let head = ''
        const front = src.match(/^---\n([\s\S]*?)\n---\n/)
        if (front) {
          head = `<pre class="front">${esc(front[1])}</pre>`
          src = src.slice(front[0].length)
        }
        // The page owns h1 and h2, so a document's headings start below them instead
        // of competing with the panel titles. An <h1> written inside a code block
        // arrives escaped as &lt;h1&gt; and is left alone by this.
        const shifted = marked
          .parse(src)
          .replace(/<(\/?)h([1-4])\b/g, (_, close, n) => `<${close}h${Math.min(+n + 2, 6)}`)
        return head + sanitize(shifted)
      }

      /* ---- the harness ------------------------------------------------------- */
      /* The system that produced everything above it, in the order a session meets
         it. Collapsed by default: this is the machinery, not the work. */
      let harnessSignature = ''
      let harness = {byId: {}}

      function drawHarness(d) {
        const stages = d.harness || []
        const signature = JSON.stringify(stages)
        if (signature === harnessSignature) return
        harnessSignature = signature

        harness.byId = Object.fromEntries(stages.flatMap((s) => s.nodes.map((n) => [n.id, n])))
        const nodes = Object.keys(harness.byId).length
        const mine = Object.values(harness.byId).filter((n) => n.origin === 'claude').length
        $('harnessCount').textContent = `${nodes} pieces`

        $('harnessFlow').innerHTML =
          `
          <div class="legend">
            <span><i style="background:var(--accent)"></i>${mine} from claude code</span>
            <span><i style="background:var(--dim)"></i>${nodes - mine} built on top</span>
          </div>` +
          stages
            .map(
              (s) => `
          <div class="stage">
            <div class="stage-head"><b>${esc(s.name)}</b><span>${esc(s.blurb)}</span></div>
            <div class="nodes">${
              s.nodes
                .map(
                  (n) =>
                    `<button class="node ${n.origin}" data-node="${esc(n.id)}" title="${esc(n.path)}">
                 <i></i>${esc(n.name)}<span class="t">${n.tokens}</span>
               </button>`,
                )
                .join('') || '<div class="empty">nothing here</div>'
            }</div>
          </div>`,
            )
            .join('')
      }

      /* ---- the detail sheet -------------------------------------------------- */
      /* One sheet, and a source per kind of thing it can be pointed at. The sheet
         knows how to open, stay current, and close; each source knows how to find its
         subject and draw it, and may hydrate it with anything too expensive to poll. */
      const SHEET = {
        bead: {find: (id) => ledger.byId[id], draw: beadSheet},
        node: {find: (id) => harness.byId[id], draw: nodeSheet, hydrate: readFile},
        diff: {find: (path) => worktree.byPath[path], draw: diffSheet, hydrate: hydrateDiff},
      }
      // The one sheet that needs the room: a unified diff read line by line is
      // fine in a reading column, but side-by-side is the point of vendoring a
      // diff renderer at all, and that needs width the prose sheet doesn't.
      const WIDE_SHEET = new Set(['diff'])
      let subject = null

      function beadSheet(i) {
        const kids = (i.children || []).map((id) => ledger.byId[id]).filter(Boolean)
        const commits = i.commits || []
        const block = (label, text) => (text ? `<section><h4>${esc(label)}</h4><p>${esc(text)}</p></section>` : '')

        return `
          <h3 class="title" id="sheetTitle">${esc(i.title)}</h3>
          <div class="meta">
            <code>${esc(i.id)}</code>
            <span class="chip">P${i.priority}</span>
            ${i.type !== 'task' ? `<span class="chip">${esc(i.type)}</span>` : ''}
            <span class="chip ${i.status === 'closed' ? 'ok' : ''}">${esc(i.status.replace('_', ' '))}</span>
            ${(i.labels || []).map((l) => `<span class="chip epic">${esc(l)}</span>`).join('')}
            ${i.owner ? `<code>@${esc(i.owner)}</code>` : ''}
          </div>
          ${block('description', i.description)}
          ${block('design', i.design)}
          ${block('notes', i.notes)}
          ${block('why it closed', i.close_reason)}
          ${
            kids.length
              ? `<section><h4>sub-beads</h4><div class="kids">${kids
                  .map(
                    (k) =>
                      `<button class="kid ${k.status === 'closed' ? 'closed' : ''}" data-bead="${esc(k.id)}">
               <span class="tick">${k.status === 'closed' ? '✓' : '○'}</span>
               <span>${esc(k.title)}</span>
             </button>`,
                  )
                  .join('')}</div></section>`
              : ''
          }
          ${
            commits.length
              ? `<section><h4>waiting to push</h4>${commits
                  .map(
                    (c) =>
                      `<div class="commit-row"><code>${esc(c.sha)}</code>
               <span>${esc(c.subject)}</span></div>`,
                  )
                  .join('')}</section>`
              : ''
          }`
      }

      /* A harness node's file is tens of thousands of characters and nobody reads it
         until they open it, so it never rides the poll — the sheet asks for one file
         and keeps it. `{text}` on success, `{error}` when there's nothing serving. */
      const fileText = {}
      const reading = new Set()

      async function readFile(id) {
        if (id in fileText || reading.has(id)) return
        reading.add(id)
        try {
          const r = await fetch('harness/' + encodeURIComponent(id))
          fileText[id] = r.ok ? {text: (await r.json()).body} : {error: 'The server has no file under that name.'}
        } catch {
          fileText[id] = {error: "Nothing is serving this page, so its contents can't be read."}
        }
        reading.delete(id)
        refreshSheet()
      }

      function nodeSheet(n) {
        const got = fileText[n.id]
        return `
          <h3 class="title" id="sheetTitle">${esc(n.name)}</h3>
          <div class="meta">
            <code>${esc(n.path)}</code>
            <span class="chip">${esc(n.origin === 'claude' ? 'claude code' : n.origin)}</span>
            <span class="chip epic">${n.tokens} tokens</span>
          </div>
          <section><h4>role</h4><p>${esc(n.role)}</p></section>
          <section><h4>contents</h4>${
            !got
              ? `<div class="note">reading…</div>`
              : got.error
                ? `<div class="note">${esc(got.error)}</div>`
                : // Prose gets rendered; a script or a ledger export is code, and code is
                  // only readable as the characters that were actually written.
                  /\.md$/i.test(n.path)
                  ? `<div class="md">${markdown(got.text)}</div>`
                  : `<pre class="file">${esc(got.text)}</pre>`
          }</section>`
      }

      /* A diff never rides the poll either — it's the unified text for one path,
         fetched fresh each time the sheet opens on it. Keyed rather than a single
         slot, so toggling a file's checkbox and reopening it doesn't show a stale
         diff for a second while the fresh one is in flight. */
      const diffCache = {}
      const diffReading = new Set()

      async function hydrateDiff(path) {
        if (diffReading.has(path)) return
        diffReading.add(path)
        try {
          const r = await fetch('diff?path=' + encodeURIComponent(path))
          diffCache[path] = r.ok ? await r.json() : {error: 'Could not load the diff.'}
        } catch {
          diffCache[path] = {error: "Nothing is serving this page, so the diff can't be read."}
        }
        diffReading.delete(path)
        refreshSheet()
      }

      /* Which grammar a path gets. Only the languages this repo actually holds —
         an extension that isn't here renders plain, which is the honest outcome
         for a file highlight.js would guess wrong about anyway. */
      const DIFF_LANGUAGE = {
        swift: 'swift',
        py: 'python',
        sh: 'bash',
        bash: 'bash',
        js: 'javascript',
        json: 'json',
        html: 'xml',
        css: 'css',
        md: 'markdown',
        yml: 'yaml',
        yaml: 'yaml',
      }

      /* diff2html's core bundle renders the table; the UI bundle that would call
         highlight.js is a separate script and does no more than this. A line at a
         time, because that's the cell the side-by-side table lays out — a string
         or comment spanning lines loses its colour at the break.
         Text nodes rather than the cell's innerHTML, because a modified line
         already holds diff2html's word-level <ins>/<del> marking which word
         changed. Overwriting the cell threw that away and left a renamed variable
         looking like an untouched line — the one thing the reader opened the diff
         for. The cost is that a token split across a mark's edge is highlighted
         as two pieces, which is the same break the line-at-a-time rule already
         accepts. */
      function highlightDiff(root, path) {
        const language = DIFF_LANGUAGE[(path.split('.').pop() || '').toLowerCase()]
        if (!language || !window.hljs || !hljs.getLanguage(language)) return
        root.querySelectorAll('.d2h-code-line-ctn').forEach((line) => {
          const walk = document.createTreeWalker(line, NodeFilter.SHOW_TEXT)
          const runs = []
          while (walk.nextNode()) runs.push(walk.currentNode)
          runs.forEach((run) => {
            if (!run.nodeValue.trim()) return
            const holder = document.createElement('span')
            holder.innerHTML = hljs.highlight(run.nodeValue, {language, ignoreIllegals: true}).value
            run.replaceWith(holder)
          })
        })
      }

      function renderDiff(text, path) {
        try {
          const holder = document.createElement('div')
          holder.innerHTML = Diff2Html.html(text, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side',
            // Follows the same prefers-color-scheme query the rest of the page
            // does, so a diff doesn't sit there in light mode inside a dark sheet.
            colorScheme: 'auto',
          })
          highlightDiff(holder, path)
          return holder.innerHTML
        } catch {
          return `<pre class="file">${esc(text)}</pre>`
        }
      }

      function diffSheet(e) {
        const got = diffCache[e.path]
        return `
          <div class="diff-header">
            ${wtIdentity(e, {clickable: true})}
            ${wtRevertButton(e)}
            <button class="diff-close" data-close-sheet aria-label="Close" title="Close">✕</button>
          </div>
          <div class="diff-body">${
            !got
              ? `<div class="note">reading…</div>`
              : got.error
                ? `<div class="note">${esc(got.error)}</div>`
                : !got.diff || !got.diff.trim()
                  ? `<div class="note">no changes.</div>`
                  : renderDiff(got.diff, e.path)
          }</div>`
      }

      /* What the sheet is currently showing. Assigning innerHTML resets the scroll
         position of everything inside it, even when the markup is identical — and a
         file long enough to scroll is exactly what this sheet holds — so the poll has
         to be able to tell "nothing changed" from "changed to the same thing". */
      let sheetHtml = ''

      function drawSheet(kind, id) {
        const found = SHEET[kind].find(id)
        if (!found) return
        const html = SHEET[kind].draw(found)
        if (html === sheetHtml) return
        sheetHtml = html
        $('sheetBody').innerHTML = html
      }

      function openSheet(kind, id) {
        if (!SHEET[kind].find(id)) return
        subject = {kind, id}
        sheetHtml = ''
        // A diff is refetched on every open — the last one is whatever the file
        // looked like the last time this path was checked, which by the time a
        // row is clicked again may not be true any more.
        if (kind === 'diff') delete diffCache[id]
        drawSheet(kind, id)
        $('sheet').classList.toggle('wide', WIDE_SHEET.has(kind))
        $('sheetBody').classList.toggle('flush', kind === 'diff')
        $('sheet').classList.add('open')
        $('scrim').classList.add('open')
        // The generic close button is hidden for a diff sheet in favour of the
        // one in its own header — that's the one to hand focus to.
        ;(kind === 'diff' ? document.querySelector('.diff-close') : $('sheetClose'))?.focus()
        SHEET[kind].hydrate?.(id)
      }

      function closeSheet() {
        subject = null
        sheetHtml = ''
        $('sheet').classList.remove('open')
        $('scrim').classList.remove('open')
      }

      /* Keep an open sheet honest: the board behind it is still polling. */
      function refreshSheet() {
        if (subject) drawSheet(subject.kind, subject.id)
      }

      /* Wired above the polling section on purpose: the frozen artifact keeps
         everything up to that line, so its cards stay openable. Nothing here needs
         the server — the sheet reads the state the page already has. */
      /* The header panel opens on a press and stays open until dismissed — clicking
         the title, anywhere outside it, or Escape. */
      document.addEventListener('click', (e) => {
        const menu = $('titlemenu')
        if (e.target.closest('#metaToggle')) {
          const open = menu.classList.toggle('open')
          $('metaToggle').setAttribute('aria-expanded', open)
          if (open) keepInView(menu)
          return
        }
        // A click inside the panel is reading it, not dismissing it.
        if (menu.classList.contains('open') && !e.target.closest('#metaTip')) closeTitleMenu()
      })

      function closeTitleMenu() {
        $('titlemenu').classList.remove('open')
        $('metaToggle').setAttribute('aria-expanded', 'false')
      }

      document.addEventListener('click', (e) => {
        const more = e.target.closest('[data-more]')
        if (more) {
          const key = more.dataset.more
          laneLimits[key] = (laneLimits[key] ?? LANE_PAGE) + LANE_PAGE
          // Forced rather than redrawn: the limit carries no draft state, and
          // a held poll must not make the press look ignored. Repaints the
          // composer from `draft`, so typed words survive it — focus moves,
          // which is the honest cost of pressing something else mid-draft.
          return paintNow()
        }
        // Lives in the ready lane's summary like the commit toggle in the work
        // tree's, so a press has to stop the native fold the same way that one
        // does — otherwise filing a bead also folds the lane it files into.
        const addBead = e.target.closest('[data-add-bead]')
        if (addBead) {
          e.preventDefault()
          return composerOpen ? cancelComposer() : openComposer()
        }
        const prio = e.target.closest('[data-prio]')
        if (prio) {
          draft.priority = +prio.dataset.prio
          // Marked in place: a repaint here would drop the title's focus.
          document
            .querySelectorAll('#composer .seg button')
            .forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.prio === draft.priority)))
          return
        }
        const sug = e.target.closest('[data-suggest]')
        if (sug) {
          const input = $('composerLabels')
          if (input) {
            // The typed fragment is the last segment; a pick replaces it and
            // the field keeps the comma-separated shape it already had.
            const kept = input.value
              .split(',')
              .slice(0, -1)
              .map((s) => s.trim())
              .filter(Boolean)
            kept.push(sug.dataset.suggest)
            input.value = kept.join(', ')
            draft.labels = input.value
            renderSuggestions(input)
            input.focus()
          }
          return
        }
        if (e.target.closest('[data-composer-save]')) return saveComposer()
        if (e.target.closest('[data-composer-cancel]')) return cancelComposer()
        // The caret sits inside its card's button, so it claims its press before
        // the card-level handler below ever sees it — expanding must not also
        // open the sheet. Forced: a repaint has to answer the press at once,
        // not wait out the next poll. Focus is handed back to the rebuilt row,
        // since repainting from innerHTML drops whatever had it.
        const expander = e.target.closest('[data-expand]')
        if (expander) {
          // The click ending a drag, or a suppressed caret-drag, is the end of
          // that gesture — not a toggle.
          if (caretSwallowed) {
            caretSwallowed = false
            return
          }
          if (Date.now() - lastDragEnd < 350) return
          const id = expander.dataset.expand
          if (expandedEpics.has(id)) expandedEpics.delete(id)
          else expandedEpics.add(id)
          paintNow()
          requestAnimationFrame(() => refocusCard(id))
          return
        }
        // A sub-bead in the sheet swaps the sheet's subject rather than stacking
        // another one on top — there's only ever one thing being looked at.
        const bead = e.target.closest('[data-bead]')
        if (bead) {
          // The press that ends a drag lands as a click on the card it started
          // from — opening the sheet for it would punish dropping.
          if (Date.now() - lastDragEnd < 350) return
          return openSheet('bead', bead.dataset.bead)
        }
        const node = e.target.closest('[data-node]')
        if (node) return openSheet('node', node.dataset.node)
        // The revert button, the checkbox, and the file-menu button (in the diff
        // sheet's own header) all live inside a row that opens a diff on any
        // other click — each has to claim its own press before that row-level
        // handler ever sees it.
        const revertBtn = e.target.closest('[data-revert]')
        if (revertBtn) return openRevertConfirm(revertBtn)
        if (e.target.closest('.wt-checkbox')) return
        const fileMenuBtn = e.target.closest('[data-filemenu]')
        if (fileMenuBtn) return openFileMenu(fileMenuBtn)
        // Lives inside <summary> like the push button before it, so a press has
        // to stop the native fold the same way that one does.
        const commitToggle = e.target.closest('[data-commit-toggle]')
        if (commitToggle) {
          e.preventDefault()
          return $('commitPop').hidden ? openCommitCompose(commitToggle) : closeCommitCompose()
        }
        const wtRow = e.target.closest('[data-diff]')
        if (wtRow) return openSheet('diff', wtRow.dataset.diff)
        if (e.target.closest('#scrim, #sheetClose, [data-close-sheet]')) closeSheet()
      })

      /* Row keyboard support piggybacks on click's own dispatch: it needs the same
         guards against the checkbox and the revert button that click already has,
         so this doesn't reimplement them — it just makes Enter/Space open one. */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        const row = e.target.closest?.('[data-diff]')
        if (!row || row !== e.target) return
        e.preventDefault()
        openSheet('diff', row.dataset.diff)
      })

      /* A repaint rebuilds the board from innerHTML, which drops the focused
      node — so a toggle hands focus back to the row it just rebuilt. */
      function refocusCard(id) {
        document.querySelector(`.card[data-bead="${CSS.escape(id)}"]`)?.focus({preventScroll: true})
      }

      /* A focused parent expands with → and folds with ←. The caret is a span
      rather than a second tab stop, so the card toggles its own subtree
      without the focus ever leaving the row. */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return
        const card = e.target.closest?.('.card[data-has-kids]')
        if (!card || card !== e.target) return
        e.preventDefault()
        const id = card.dataset.bead
        if (e.key === 'ArrowRight') expandedEpics.add(id)
        else expandedEpics.delete(id)
        paintNow()
        requestAnimationFrame(() => refocusCard(id))
      })

      /* `toggle` doesn't bubble, so it's caught on the way down. Folding is the
         reader's, not the ledger's: it survives every repaint until they say
         otherwise. */
      document.addEventListener(
        'toggle',
        (e) => {
          const lane = e.target.closest?.('[data-lane]')
          if (!lane) return
          lane.open ? foldedLanes.delete(lane.dataset.lane) : foldedLanes.add(lane.dataset.lane)
        },
        true,
      )

      /* The composer writes through to `draft` on every keystroke, so a repaint
         rebuilds the same words. Suggestions update the dropdown in place — a
         repaint here would move focus after every letter. */
      document.addEventListener('input', (e) => {
        if (e.target.id === 'composerTitle') draft.title = e.target.value
        else if (e.target.id === 'composerDesc') draft.description = e.target.value
        else if (e.target.id === 'composerLabels') {
          draft.labels = e.target.value
          renderSuggestions(e.target)
        }
      })
      document.addEventListener('focusin', (e) => {
        if (e.target.id === 'composerLabels') renderSuggestions(e.target)
      })

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return
        closeTitleMenu()
        closeRevertConfirm()
        closeFileMenu()
        closeCommitCompose()
        hideSuggestions()
        // A sheet on top owns the press; the composer behind it stays as it was.
        if (composerOpen && !subject) cancelComposer()
        if (subject) closeSheet()
      })

      /* ---- work tree interactions --------------------------------------------- */
      /* A checkbox's own change fires after click already ran and let it through
         (the click handler above returns early on `.wt-checkbox` rather than
         opening a diff), so staging is wired here instead of there. */
      document.addEventListener('change', (e) => {
        if (!e.target.matches('.wt-checkbox')) return
        const path = e.target.dataset.stage
        const staged = e.target.checked
        e.target.disabled = true
        fetch('worktree/' + (staged ? 'stage' : 'unstage'), {method: 'POST', body: JSON.stringify({path})})
          .then(() => {
            // Whichever side of the index the file is on now, the diff for it just
            // changed — a stale cached one would show the wrong half of the edit.
            delete diffCache[path]
            if (subject && subject.kind === 'diff' && subject.id === path) hydrateDiff(path)
            return tick()
          })
          .finally(() => (e.target.disabled = false))
      })

      /* The revert and file-action popovers are single fixed elements repositioned
         over whichever row was pressed, rather than one per row — rows are thrown
         away and rebuilt on every poll, and a popover that lived inside one would
         vanish out from under a reader mid-decision. */
      let revertTarget = null

      // Anchored under the control that opened it, but nudged back onto the
      // screen when that control sits near an edge — the revert icon and the
      // commit button both live at the far right of their rows, and either can
      // sit close enough to the bottom that a popover opening below it (the
      // commit compose is tall enough, with its textarea, to do this often)
      // would render partly off-screen with nothing to scroll it into view.
      function placePopover(pop, box, width) {
        pop.style.left = `${Math.round(Math.min(box.left, innerWidth - width - 12))}px`
        const height = pop.getBoundingClientRect().height
        const fitsBelow = box.bottom + 6 + height <= innerHeight - 12
        const top = fitsBelow ? box.bottom + 6 : Math.max(12, box.top - height - 6)
        pop.style.top = `${Math.round(top)}px`
      }

      function openRevertConfirm(btn) {
        closeFileMenu()
        revertTarget = btn.dataset.revert
        $('revertConfirmName').textContent = revertTarget
        const pop = $('revertConfirm')
        pop.hidden = false
        placePopover(pop, btn.getBoundingClientRect(), 220)
      }

      function closeRevertConfirm() {
        $('revertConfirm').hidden = true
        revertTarget = null
      }

      $('revertCancel').addEventListener('click', closeRevertConfirm)
      $('revertConfirmBtn').addEventListener('click', () => {
        if (!revertTarget) return
        const path = revertTarget
        closeRevertConfirm()
        fetch('worktree/revert', {method: 'POST', body: JSON.stringify({path})}).then(() => {
          delete diffCache[path]
          // The row it belonged to is gone — reverting is what a diff sheet's own
          // checkbox can trigger, and the sheet has nothing left to show.
          if (subject && subject.kind === 'diff' && subject.id === path) closeSheet()
          return tick()
        })
      })

      let fileMenuTarget = null

      function openFileMenu(btn) {
        closeRevertConfirm()
        fileMenuTarget = btn.dataset.filemenu
        const pop = $('fileMenu')
        pop.hidden = false
        placePopover(pop, btn.getBoundingClientRect(), 200)
      }

      function closeFileMenu() {
        $('fileMenu').hidden = true
        fileMenuTarget = null
      }

      $('fileMenuReveal').addEventListener('click', () => {
        if (!fileMenuTarget) return
        fetch('worktree/reveal', {method: 'POST', body: JSON.stringify({path: fileMenuTarget})})
        closeFileMenu()
      })
      $('fileMenuVscode').addEventListener('click', () => {
        if (!fileMenuTarget) return
        fetch('worktree/vscode', {method: 'POST', body: JSON.stringify({path: fileMenuTarget})})
        closeFileMenu()
      })

      /* ---- commit compose ------------------------------------------------------ */
      function autoGrowTextarea(el) {
        el.style.height = 'auto'
        el.style.height = `${el.scrollHeight}px`
      }
      $('commitMsg').addEventListener('input', (e) => autoGrowTextarea(e.target))

      // Read by `worktreeLane` so the toggle button still renders pressed after
      // a board repaint regenerates it from scratch — the DOM attribute set
      // below is only the instant feedback, not the source of truth.
      let commitComposeOpen = false

      function openCommitCompose(btn) {
        closeRevertConfirm()
        closeFileMenu()
        commitComposeOpen = true
        const pop = $('commitPop')
        pop.hidden = false
        placePopover(pop, btn.getBoundingClientRect(), 450)
        btn.setAttribute('aria-expanded', 'true')
        const ta = $('commitMsg')
        requestAnimationFrame(() => {
          ta.focus()
          autoGrowTextarea(ta)
        })
      }

      function closeCommitCompose() {
        commitComposeOpen = false
        $('commitPop').hidden = true
      }

      // A click anywhere else is a dismissal — these three are the only popovers
      // that open on a press rather than a hover, so they're the only ones that
      // need to catch a press that lands somewhere else.
      document.addEventListener('click', (e) => {
        if (!$('revertConfirm').hidden && !e.target.closest('#revertConfirm, [data-revert]')) closeRevertConfirm()
        if (!$('fileMenu').hidden && !e.target.closest('#fileMenu, [data-filemenu]')) closeFileMenu()
        if (!$('commitPop').hidden && !e.target.closest('#commitPop, [data-commit-toggle]')) closeCommitCompose()
        // The composer stays — typed text must not evaporate on a stray press —
        // but its suggestions are just a hint and go away like any popover.
        if (composerOpen && !e.target.closest('#composer, [data-add-bead]')) hideSuggestions()
      })

      $('commitSubmit').addEventListener('click', async () => {
        const message = $('commitMsg').value
        const amend = $('commitAmend').checked
        const btn = $('commitSubmit')
        const err = $('commitError')
        btn.disabled = true
        err.hidden = true
        try {
          const r = await (
            await fetch('worktree/commit', {method: 'POST', body: JSON.stringify({message, amend})})
          ).json()
          if (r.ok) {
            $('commitMsg').value = ''
            $('commitAmend').checked = false
            autoGrowTextarea($('commitMsg'))
            closeCommitCompose()
            tick()
          } else {
            err.textContent = r.error || 'commit failed'
            err.hidden = false
          }
        } catch {
          err.textContent = "nothing is serving this page, so the commit didn't go through"
          err.hidden = false
        } finally {
          btn.disabled = false
        }
      })

      /* ---- run controls ----------------------------------------------------- */
      /* The header carries the ones that put the app in front of you — whatever
         dashboard.toml places there. Running the gate belongs with
         the word that reports it, so it sits in the gate's own pane instead, and
         the gate's note is what those runs last said. */
      let runsSignature = ''
      let lastRunNote = ''

      function drawRuns() {
        const signature = Object.keys(runStates)
          .map((k) => `${k}:${runStates[k].state}`)
          .join('|')
        if (signature !== runsSignature) {
          runsSignature = signature
          $('runs').innerHTML = runSlot('header')
        }

        // Named by key rather than by label: the button in the gate says "run",
        // but a note under it has to say which run it is reporting.
        const last = Object.entries(runStates)
          .filter(([, r]) => r.where === 'gate' && r.state !== 'idle' && r.output)
          .sort((a, b) => (b[1].at || 0) - (a[1].at || 0))[0]
        lastRunNote = last ? `${last[0]}: ${last[1].output} · ${last[1].ago}` : ''
      }

      /* ---- the popovers ----------------------------------------------------- */
      /* The gate is one word in the header. Green means what's on disk has been
         proven; anything else is the number of commits nobody has checked. */
      function drawGate(d) {
        const v = d.verify
        $('gateLabel').textContent =
          v.status === 'passed' ? 'verified' : v.status === 'failed' ? 'failing' : 'unverified'
        $('gate').className = 'gate hoverable ' + (v.status === 'passed' ? 'good' : v.status === 'failed' ? 'bad' : '')
      }

      let verifySignature = ''

      function drawVerify(d) {
        const tip = $('verifyTip')
        if (!tip) return
        const v = d.verify
        const cls = v.status === 'passed' ? 'ok' : v.status === 'failed' ? 'bad' : ''
        // The pane holds a button now, so it can't be rebuilt on every poll — the
        // press would land on an element that had already been replaced under it.
        const button = runSlot('gate')
        const signature = JSON.stringify([v, lastRunNote, button, d.git.branch])
        if (signature === verifySignature) return
        verifySignature = signature
        tip.innerHTML =
          `<h3>the gate${button}</h3>` +
          (lastRunNote ? `<div class="run-note">${esc(lastRunNote)}</div>` : '') +
          row('last run', v.status + (v.when ? ' · ' + v.when : ''), cls) +
          v.steps.map((s) => row(s.name, s.ok ? 'ok' : 'failed', s.ok ? 'ok' : 'bad')).join('') +
          (v.tests ? row('suite', v.tests) : '') +
          (v.took ? row('took', v.took) : '') +
          row('branch', d.git.branch) +
          ((v.unverified || []).length
            ? `<h3 style="margin-top:12px">landed since</h3>` +
              v.unverified
                .map(
                  (c) =>
                    `<div class="note" style="margin-top:4px"><code>${esc(c.sha)}</code>
                     ${esc(c.subject)}</div>`,
                )
                .join('') +
              `<div class="note">Counted as commits, not beads — a commit that names
                   no bead has no card in the commit lane.</div>`
            : `<div class="note">scripts/verify.sh — build, tests, and a smoke check
                 behind one exit code.</div>`)
      }

      function drawReview(d) {
        const tip = $('reviewTip')
        if (!tip) return
        tip.innerHTML =
          `<h3>reviewers</h3>` +
          d.agents.map((a) => row(a.name, a.model, 'warn')).join('') +
          `<div class="note">scripts/review.sh bundles the diff once; both agents read
             that packet rather than the repo. Move a bead here with
             <code>bd label add &lt;id&gt; review</code>.</div>`
      }

      function drawCommit(d) {
        const tip = $('commitTip')
        if (!tip) return
        const g = d.git
        tip.innerHTML =
          `<h3>committing</h3>` +
          row('uncommitted files', g.dirty, g.dirty ? 'warn' : 'ok') +
          row('unpushed commits', (g.unpushed || []).length, (g.unpushed || []).length ? 'warn' : 'ok') +
          row('tracking', g.upstream || 'no upstream', g.upstream ? '' : 'warn') +
          row('last commit', `${g.last.sha} · ${g.last.when}`) +
          `<div class="note">A bead lands here when an unpushed commit names it —
             finished on this machine, nowhere else.</div>`
      }

      function drawMeta(d) {
        const b = d.budget
        const onDemand = b.on_demand.reduce((n, x) => n + x.tokens, 0)
        const total = b.always_total + onDemand
        const pct = (n) => ((100 * n) / total).toFixed(1) + '%'

        $('metaTip').innerHTML = `
          <div class="group">
            <h3>context budget</h3>
            <div class="bar">
              <span style="width:${pct(b.always_total)};background:var(--warn)"></span>
              <span style="width:${pct(onDemand)};background:var(--accent);opacity:.45"></span>
            </div>
            <div class="legend">
              <span><i style="background:var(--warn)"></i>${b.always_total} every session</span>
              <span><i style="background:var(--accent);opacity:.45"></i>${onDemand} on demand</span>
            </div>
            ${b.always.map((a) => row(a.name, a.tokens)).join('')}
            <div class="note save">The session brief costs <b>${b.brief_tokens} tokens</b> where
              <code>bd prime</code> cost ~${b.prime_tokens} — <b>${b.prime_tokens - b.brief_tokens}
              saved</b> on every session, not just the first.</div>
          </div>
          <div class="group">
            <h3>ledger health</h3>
            ${row('ready to claim', d.ledger.counts.ready, d.ledger.counts.ready ? '' : 'warn')}
            ${row('stale (14d+)', d.ledger.stale ?? 0, d.ledger.stale ? 'warn' : '')}
            ${row('commits today', d.git.commits_today)}
            <div class="note">Work that stops moving is the failure a solo loop can't
              see. Nothing ready means the next session has nothing to pick up.</div>
          </div>
          <div class="group">
            <h3>capabilities</h3>
            ${d.skills.map((s) => row(s.name, `${s.idle} idle · ${s.loaded} loaded`)).join('')}
            ${d.agents.map((a) => row(a.name, a.model, 'warn')).join('')}
            <div class="note">Skills cost their description until invoked. Reviewers run on
              cheap models, off the diff.</div>
          </div>`
      }

      /* ---- polling ---------------------------------------------------------- */
      function draw(d) {
        // Before anything else: every run button on the page reads this.
        runStates = d.runs || {}
        drawRuns()
        drawBoard(d)
        drawBacklog(d)
        drawHarness(d)
        refreshSheet()
        drawVerify(d)
        drawReview(d)
        drawCommit(d)
        drawMeta(d)
        $('branchline').textContent = `${d.git.branch} · ${d.ledger.counts.open} open`
        document.title = `${d.project} · harness`
        $('projectName').textContent = d.project
        drawGate(d)
      }

      /* A dropped poll and a broken repaint are different failures and are caught
         apart. They used to share one try: a fetch that didn't come back jumped
         past every draw, so the pulse read offline while the board silently held
         whatever it last painted — which is what "the dashboard stopped showing
         new beads" looks like from the outside. The connection is the pulse's
         business. The board keeps showing the last state that arrived, because a
         few seconds stale is still the truest picture anyone has. */
      async function tick() {
        let d
        try {
          d = await (await fetch('state.json?t=' + Date.now(), {cache: 'no-store'})).json()
        } catch (e) {
          $('pulse').className = 'pulse stale'
          $('pulseLabel').textContent = 'offline'
          $('pulseTip').innerHTML =
            `<h3>offline</h3>` +
            `<div class="note">The last poll didn't come back. ${
              lastLedger
                ? 'The board is the last state that did.'
                : 'Nothing has arrived yet.'
            } If this stays, start the server with
            <code>scripts/dashboard.py</code>.</div>`
          return
        }

        try {
          draw(d)
        } catch (e) {
          // The state arrived; the page couldn't paint it. That's a bug here, not
          // a server that stopped answering, and saying "offline" would send
          // whoever reads this looking in the wrong place.
          $('pulse').className = 'pulse stale'
          $('pulseLabel').textContent = 'draw failed'
          $('pulseTip').innerHTML =
            `<h3>draw failed</h3>` +
            `<div class="note">The state arrived but the page could not paint it:
             <code>${esc(String(e))}</code></div>`
          return
        }

        $('pulse').className = 'pulse'
        $('pulseLabel').textContent = 'live'
        $('pulseTip').innerHTML =
          `<h3>live</h3>` +
          row('last read', d.generated) +
          row('polling', 'every 2.5s') +
          `<div class="note">Read from bd and git by
             <code>scripts/dashboard.py</code>, which rebuilds on a thread of its
             own. Every poll after the first is handed the last snapshot it
             finished, rather than waiting for a new one.</div>`
      }
      /* Pane placement is measured, not guessed. Which lane sits nearest an edge
         changes with the wrap, so a nth-child rule was always going to be wrong on
         some layout; this nudges whichever pane is about to open back inside the
         viewport. */
      function keepInView(anchor) {
        const tip = anchor.querySelector(':scope > .tip')
        if (!tip) return
        tip.style.marginLeft = '0px'
        const box = tip.getBoundingClientRect()
        const edge = 12
        let dx = 0
        if (box.right > innerWidth - edge) dx = innerWidth - edge - box.right
        if (box.left + dx < edge) dx = edge - box.left
        tip.style.marginLeft = `${Math.round(dx)}px`
      }

      for (const event of ['pointerenter', 'focusin']) {
        document.addEventListener(
          event,
          (e) => {
            const anchor = e.target.closest?.('.gate, .pulse, .lane-name.hoverable')
            if (anchor) keepInView(anchor)
          },
          true,
        )
      }

      /* Below the polling line, so the frozen artifact drops it: without a server
         these would be dead controls, and one that looks live and isn't is worse
         than none. */
      document.addEventListener('click', (e) => {
        const button = e.target.closest('[data-task]')
        if (!button) return
        // `push` sits in a lane's summary, where a plain click would also fold the
        // lane out from under the reader.
        e.preventDefault()
        // Answer the press on this frame rather than waiting out the poll: mark it
        // running in the state every run button is drawn from, then redraw this one
        // from it, so it picks up the table's own busy label and loses its old one.
        const key = button.dataset.task
        runStates[key].state = 'running'
        button.outerHTML = runButton(key)
        fetch('run/' + key, {method: 'POST'}).then(tick)
      })

      tick()
      setInterval(tick, 2500)
    </script>
  </body>
</html>

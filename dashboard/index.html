<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harness</title>
    <link rel="stylesheet" href="vendor/diff2html.min.css" />
    <style>
      :root {
        /* Section-header palette. Flat pop brights, identical in both modes;
        every bar is light enough for the same fixed dark ink — text follows
        the fill, not the mode. */
        --pop-rose: #ff7597;
        --pop-apricot: #ffa05c;
        --pop-butter: #ffd166;
        --pop-mint: #52df9e;
        --pop-sky: #7ab5ff;
        --pop-grape: #b79bff;
        /* Pale neutral fallback for lanes that name no fill of their own, so an
        unknown lane degrades to grey instead of transparent. Fixed, not
        adaptive, so the dark header ink always holds. */
        --ash: #d4d5cf;
        --bg: #f6f6f4;
        --panel: #fffffe;
        --ink: #14150f;
        --dim: #6d6f66;
        --line: #e0e0d8;
        --accent: #6a5acd;
        --ok: #2e7d55;
        --warn: #b4690e;
        --fail: #b3352c;
        --blue: #2f6690;
        --teal: #137a6c;
        --idle: #b9bab0;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14150f;
          --panel: #1c1e17;
          --ink: #eceade;
          --dim: #92948a;
          --line: #2c2f26;
          --accent: #9d8df1;
          --ok: #5fc48b;
          --warn: #e0a33f;
          --fail: #f0776b;
          --blue: #6fa8d8;
          --teal: #4fc3ad;
          --idle: #4a4d42;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: clip;
      }
      body {
        /* Popovers are in the layout even while hidden, so one hanging past the
       right edge scrolls the whole page sideways. `clip` refuses the scroll
       without making the body a scroll container; the width cap below keeps
       the visible ones inside the viewport so nothing readable is cut off. */
        overflow-x: clip;
        margin: 0;
        padding: 26px clamp(16px, 3.5vw, 40px) 48px;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.55 ui-sans-serif,
          -apple-system,
          'SF Pro Text',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-size: 19px;
        font-weight: 620;
        margin: 0;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 11px;
        font-weight: 620;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--ink);
        margin: 0;
      }
      /* The title and the status text sit on one baseline — they read as a single
     line of writing, not a row of boxes at different heights. The buttons are
     boxes, so they centre themselves against it instead. */
      header {
        display: flex;
        align-items: baseline;
        gap: 11px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .meta-line {
        display: flex;
        align-items: baseline;
        gap: 7px;
        flex-wrap: wrap;
      }
      .runs {
        align-self: center;
      }
      .sub {
        color: var(--dim);
        font-size: 13px;
      }
      .dot {
        color: var(--dim);
        font-size: 13px;
        opacity: 0.6;
      }
      .gate {
        position: relative;
        font-size: 13px;
        color: var(--dim);
        cursor: help;
        text-decoration: underline dotted color-mix(in srgb, currentColor 50%, transparent);
        text-underline-offset: 3px;
      }
      .gate.good {
        color: var(--ok);
      }
      .gate.bad {
        color: var(--fail);
      }
      .gate .tip {
        left: -12px;
        width: 268px;
      }
      /* focus-within, not just focus-visible: the run button lives in this pane, and
     a pane that vanishes when its own control takes focus can't be pressed. */
      .gate:hover .tip,
      .gate:focus-visible .tip,
      .gate:focus-within .tip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .pulse {
        position: relative;
        font-size: 13px;
        color: var(--ok);
        cursor: help;
        text-decoration: underline dotted color-mix(in srgb, currentColor 50%, transparent);
        text-underline-offset: 3px;
      }
      .pulse.stale {
        color: var(--fail);
      }
      .pulse .tip {
        left: -12px;
        width: 250px;
      }
      .pulse:hover .tip,
      .pulse:focus-visible .tip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      @keyframes beat {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
        box-shadow: var(--shadow);
        /* Rows run to the card's edge, so the card has to clip them: a hover fill
       squaring off the corner it sits in is the giveaway that it isn't. */
        overflow: hidden;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      /* The page's readable column, the same width the sheet holds prose to. A row
     gives its title the whole card, so on a wide display an uncapped board turns
     every bead into one long line the eye has to track back across. The fixed
     overlays — scrim, sheet, the anchored popovers — set their own geometry and
     aren't in this flow. */
      header,
      .backlog,
      .board,
      .harness {
        max-width: 856px;
        margin-inline: auto;
      }

      /* The lanes are the loop, read top to bottom: claimable down to done, with
     the stages work passes through as lanes like any other rather than a
     separate diagram to cross-reference. Each is its own card, so a lane can be
     folded away without taking its neighbours with it, and a lane holding
     nothing isn't drawn at all. */
      .board {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      /* One bead per row. A lane is a list you read down, and a row gives a title
     the whole width instead of wrapping it into a card three lines tall — six
     beads become six lines rather than a wall. */
      /* No padding of its own: every edge a row has belongs to the row, so the
     hover fill and the separators reach the full width of the card instead of
     stopping short of it. */
      .lane-cards {
        display: flex;
        flex-direction: column;
      }
      .lane > summary {
        background: var(--ash);
        /* Fallback only — every lane names its own fill below. Fixed dark ink
        like the rest of the bars. */
        color: #14150f;
      }
      .lane[open] > summary {
        border-radius: 14px 14px 0 0;
      }
      /* Filled bars meet square content when open — without this the bar's
      rounded bottom corners butt against the rows below it. */
      .backlog[open] > summary,
      .harness[open] > summary {
        border-radius: 14px 14px 0 0;
      }
      .lane > summary h2 {
        font-size: 11.5px;
        letter-spacing: 0.06em;
      }
      /* Whichever comes first takes the gap, so the pair sits at the far edge
     rather than against the lane's name. */
      .lane > summary .mini,
      .lane > summary .mini ~ .n {
        margin-left: 0;
      }
      .lane > summary .mini:first-of-type {
        margin-left: auto;
      }
      /* A lane arriving is news — work moved into it. It grows out of nothing
     rather than the page jumping a card taller, and leaves the same way, so the
     eye can follow which lane changed. */
      .lane.entering {
        animation: lane-in 0.34s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .lane.leaving {
        animation: lane-in 0.22s cubic-bezier(0.32, 0.72, 0, 1) reverse forwards;
        pointer-events: none;
      }
      @keyframes lane-in {
        from {
          opacity: 0;
          transform: translateY(-8px) scaleY(0.96);
          transform-origin: top;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lane.entering,
        .lane.leaving {
          animation-duration: 0.01ms;
        }
      }
      /* What a lane says when it has no cards. Padded like a row, because that's
     what it stands in for. */
      .lane-note {
        margin: 0;
        padding: 13px 20px;
        font-size: 12px;
        color: var(--dim);
      }

      /* The tail of a long lane, folded behind one press rather than scrolled past:
     `done` is sixty-odd beads and nobody opens the page to read them. */
      .load-more {
        font: inherit;
        font-size: 11.5px;
        color: var(--dim);
        background: none;
        border: 0;
        border-top: 1px solid var(--line);
        padding: 12px 20px;
        text-align: left;
        cursor: pointer;
        transition: color 0.15s;
      }
      .load-more:hover {
        color: var(--accent);
      }
      .mini {
        font: inherit;
        font-size: 9.5px;
        font-weight: 620;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--dim);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1px 8px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .mini:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* A toggle button whose popover is open reads as pressed, the same filled
     look a native segmented control gives its active segment. */
      .mini[aria-expanded='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--panel);
      }
      .mini:disabled {
        cursor: progress;
      }
      .mini.failed {
        border-color: var(--fail);
        color: var(--fail);
      }
      .mini.ok {
        border-color: var(--ok);
        color: var(--ok);
      }
      /* Section headers take the palette flat, identical in both modes: grape
      for the accent lanes, sky for active work, rose for blocked, mint for
      done, butter for staging, apricot for the machinery. Status and
      machinery share the same weight on purpose — the board reads as one
      family — so tell them apart by hue, not by treatment. Every bar is light
      enough for the same fixed dark ink — text follows the fill, not the mode. */
      .lane.ready > summary,
      .lane.review > summary {
        background: var(--pop-grape);
        color: #14150f;
      }
      .lane.in_progress > summary {
        background: var(--pop-sky);
        color: #14150f;
      }
      .lane.blocked > summary {
        background: var(--pop-rose);
        color: #14150f;
      }
      .lane.done > summary {
        background: var(--pop-mint);
        color: #14150f;
      }
      .lane.staging > summary {
        background: var(--pop-butter);
        color: #14150f;
      }
      .lane.worktree > summary {
        background: var(--pop-apricot);
        color: #14150f;
      }
      /* Backlog and the harness have no status colour, so they take apricot
      like the work tree. */
      .backlog > summary,
      .harness > summary {
        background: var(--pop-apricot);
        color: #14150f;
      }
      .lane-name.hoverable {
        position: relative;
        cursor: help;
      }
      .commit-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
        font-size: 11.5px;
      }
      .commit-row:last-child {
        border-bottom: 0;
      }
      .commit-row code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        color: var(--dim);
        white-space: nowrap;
      }

      /* ---- work tree ---------------------------------------------------------- */
      /* A <details> lane like its siblings — the commit button that opens a
     popover is exactly the shape the push button already is (a stateless
     control living inside <summary>, guarded by the same preventDefault so a
     press on it doesn't also fold the lane), so nothing here needs to fight
     the native disclosure to get folding and the board's spacing for free. */
      .mini.danger {
        border-color: color-mix(in srgb, var(--fail) 55%, var(--line));
        color: var(--fail);
      }
      .mini.danger:hover:not(:disabled) {
        border-color: var(--fail);
      }
      .wt-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 20px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        transition: background 0.15s;
      }
      .wt-row:last-child {
        border-bottom: 0;
      }
      .wt-row:hover {
        background: color-mix(in srgb, var(--accent) 11%, transparent);
      }
      .wt-revert {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        color: var(--dim);
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .wt-revert:hover {
        color: var(--fail);
        background: color-mix(in srgb, var(--fail) 14%, transparent);
      }
      .wt-revert svg {
        width: 13px;
        height: 13px;
      }
      /* Native checkboxes carry the OS's own unchecked fill (usually stark white),
     which reads wrong against a dark row. Redrawn from scratch so both states
     use the page's own palette — a tinted secondary fill at rest, accent when
     checked, with the tick drawn as a two-segment border rather than an image.
     Global rather than scoped to the work-tree rows: any checkbox this page
     grows later gets the same look for free. */
      input[type='checkbox'] {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 15px;
        height: 15px;
        margin: 0;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--dim) 20%, transparent);
        cursor: pointer;
        display: inline-flex;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      input[type='checkbox']:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      input[type='checkbox']:checked::after {
        content: '';
        width: 4px;
        height: 7px;
        margin: 1px auto 0 4px;
        border: solid #fff;
        border-width: 0 1.6px 1.6px 0;
        transform: rotate(45deg);
      }
      .wt-status {
        flex: none;
        font-size: 9.5px;
        font-weight: 620;
        color: var(--dim);
        text-transform: uppercase;
      }
      .wt-status.wt-d {
        color: var(--fail);
      }
      .wt-status.wt-m {
        color: var(--blue);
      }
      .wt-status.wt-n {
        color: var(--ok);
      }
      .wt-name {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wt-dir {
        margin-left: 0.5em;
        color: var(--dim);
      }
      .wt-base {
        color: var(--ink);
      }

      /* ---- diff sheet ---------------------------------------------------------- */
      .sheet.wide {
        max-width: min(1440px, calc(100vw - 32px));
      }
      /* Its own bar, not a `.wt-row` wearing a hat — a row is a whole-row button
     that opens a diff; this is a sticky toolbar that already IS the open diff,
     plus a close button a row never needs. Composed from the same `wtIdentity`/
     `wtRevertButton` pieces, shaped into whatever layout this context wants
     rather than the row's own div and padding. Sits in a `#sheetBody.flush`
     sheet (see `#sheetBody` above): with no ambient padding fighting it, it
     runs edge to edge and `top: 0` sticks it flush against the sheet's own
     top, no negative margin required to get there. */
      .diff-header {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: default;
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 16px 20px;
        background: var(--panel);
        border-radius: 18px 18px 0 0;
      }
      .diff-close {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 26px;
        height: 26px;
        padding: 0;
        font-size: 15px;
        line-height: 1;
        color: var(--dim);
        background: none;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .diff-close:hover {
        color: var(--ink);
        background: color-mix(in srgb, var(--ink) 8%, transparent);
      }
      /* diff2html's own per-file header repeats the filename this sheet's own
     header already shows, right below it — a second name plus its own
     dividing line read as a stray separator rather than a header for
     anything, since there's only ever one file in view here. */
      .diff-body .d2h-file-header {
        display: none;
      }
      /* Side-by-side ships built to scroll a long line rather than wrap it —
     fine in an IDE, but this sheet is read top to bottom and a line clipped
     at the edge is a line half the reader never sees. Wrapped instead, so
     the diff grows down rather than getting cut off sideways. */
      .diff-body .d2h-file-side-diff {
        overflow-x: visible;
      }
      /* Both were sized for one line: `d2h-code-line-ctn` claims a flat 100% of
     its row, which is fine when overflow just scrolls off past it, but is
     exactly wide enough to leave the +/- prefix before it nowhere to sit —
     wrapping was pushing the prefix onto a line of its own. Block display
     drops that inline-block box model in favour of ordinary text flow, where
     the prefix and the content share one line until there's genuinely no
     room left. The left padding clears the line-number gutter, which is
     absolutely positioned over the row's own left edge rather than sharing
     space with it in flow — content padded any less sits underneath it. */
      .diff-body .d2h-code-line,
      .diff-body .d2h-code-side-line {
        display: block;
        white-space: normal;
        width: auto;
        padding: 0 0.6em 0 4.5em;
      }
      .diff-body .d2h-code-line-ctn {
        display: inline;
        width: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .wt-filename {
        flex: 1;
        min-width: 0;
        display: block;
        font: inherit;
        font-size: 15px;
        font-weight: 620;
        letter-spacing: -0.01em;
        background: none;
        border: 0;
        padding: 2px 4px;
        margin: -2px -4px;
        border-radius: 6px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      .wt-filename:hover {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .diff-body {
        padding: 0 0 20px;
      }
      /* highlight.js ships themes, but every one of them is a foreign palette
     dropped inside this page. These are the page's own tokens, so the diff
     follows the same light/dark switch everything else does and needs no second
     stylesheet. Only the classes the vendored grammars actually emit. */
      .d2h-code-line-ctn .hljs-comment,
      .d2h-code-line-ctn .hljs-quote {
        color: var(--dim);
        font-style: italic;
      }
      .d2h-code-line-ctn .hljs-keyword,
      .d2h-code-line-ctn .hljs-selector-tag,
      .d2h-code-line-ctn .hljs-meta {
        color: var(--accent);
      }
      .d2h-code-line-ctn .hljs-string,
      .d2h-code-line-ctn .hljs-attr,
      .d2h-code-line-ctn .hljs-attribute {
        color: var(--ok);
      }
      .d2h-code-line-ctn .hljs-number,
      .d2h-code-line-ctn .hljs-literal,
      .d2h-code-line-ctn .hljs-symbol {
        color: var(--warn);
      }
      .d2h-code-line-ctn .hljs-type,
      .d2h-code-line-ctn .hljs-built_in,
      .d2h-code-line-ctn .hljs-class .hljs-title {
        color: var(--teal);
      }
      .d2h-code-line-ctn .hljs-title,
      .d2h-code-line-ctn .hljs-function .hljs-title,
      .d2h-code-line-ctn .hljs-section {
        color: var(--blue);
      }
      .d2h-code-line-ctn .hljs-variable,
      .d2h-code-line-ctn .hljs-property,
      .d2h-code-line-ctn .hljs-params {
        color: var(--ink);
      }
      .diff-body .d2h-wrapper {
        overflow-x: auto;
      }
      .diff-body > .note {
        padding: 0 20px;
      }
      /* diff2html ships its own light/dark palette behind this class, toggled by
     `colorScheme: 'auto'` — the theme it draws in follows the same media query
     the rest of the page does, without this page having to restate its colours. */

      /* ---- anchored popovers (revert confirm, file menu, commit compose) ------ */
      /* Fixed and positioned by JS over whichever control opened them, rather than
     `position: relative` children of that control — the work-tree rows they
     hang off get thrown away and rebuilt on every board repaint, and a
     popover that lived inside one (with typed commit text, say) would vanish
     or reset out from under the reader mid-use. */
      .popconfirm,
      .popmenu,
      .popover {
        position: fixed;
        z-index: 70;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .popconfirm {
        width: 220px;
        padding: 12px 14px;
      }
      .popconfirm p {
        margin: 0 0 10px;
        font-size: 12.5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .popconfirm .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .popmenu {
        min-width: 220px;
        max-width: min(420px, calc(100vw - 24px));
        padding: 6px;
      }
      .popmenu button {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 12.5px;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 7px;
        padding: 7px 9px;
        cursor: pointer;
      }
      .popmenu button:hover {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
      }
      .commit-pop {
        width: 450px;
        padding: 12px;
      }
      .commit-pop textarea {
        display: block;
        width: 100%;
        resize: none;
        overflow: hidden;
        font: inherit;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        box-sizing: border-box;
      }
      .commit-pop textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .commit-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 9px;
      }
      .commit-amend {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--dim);
        cursor: pointer;
      }
      .commit-error {
        margin-top: 8px;
        font-size: 11px;
        color: var(--fail);
        overflow-wrap: anywhere;
      }

      /* A row opens a dialog, so it is a button — that buys the keyboard, the
     focus ring, and the role without re-implementing any of them. Ruled rather
     than boxed: at one bead per line, six borders read as a grid of cages. */
      .card {
        display: flex;
        gap: 12px;
        align-items: baseline;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 12px 20px;
        background: none;
        min-width: 0;
        cursor: pointer;
        transition: background 0.15s;
      }
      .card:last-child {
        border-bottom: 0;
      }
      .card:hover {
        background: color-mix(in srgb, var(--accent) 11%, transparent);
      }
      .lane.done .card {
        opacity: 0.5;
      }
      .card b {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 560;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      /* Held to the row's own line: the title takes what it needs and the meta
     trails it, rather than the meta wrapping the row into a second line. */
      .card .meta {
        display: flex;
        gap: 7px;
        align-items: baseline;
        flex-wrap: wrap;
        justify-content: flex-end;
        flex: 0 1 auto;
        font-size: 10.5px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .card .meta code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        white-space: nowrap;
      }
      .chip {
        font-size: 9.5px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      /* An epic's title is a sentence, not a word, and nowrap sent it straight out
     of the card. The chip gives up its width rather than the card's. */
      .chip.epic {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        color: var(--dim);
      }
      .chip.ok {
        background: color-mix(in srgb, var(--ok) 16%, transparent);
        color: var(--ok);
      }
      /* Sits ahead of the title in the card's own flex row, so it needs its own
      width protected — the title is the flexible side, not this. */
      .chip.prio {
        flex-shrink: 0;
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        color: var(--dim);
      }
      /* The bead's last three characters, so a card can be named out loud.
      Monospace and un-uppercased: it reads as an id, not a status. */
      .chip.id {
        flex-shrink: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        background: none;
        color: var(--dim);
      }
      .waits {
        color: var(--fail);
      }
      /* A parent's inline children: the same rows, told apart by a darker
      fill rather than an indent. */
      .card.kid {
        background: var(--bg);
      }
      .card.kid:hover {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      /* The expander lives last in the card's flex row, so it sits at the far
      edge whatever the title and the meta do. A span, not a button: a button
      inside the card's own button is invalid HTML. The click handler claims a
      press on it before the sheet ever sees it, and arrows toggle it from the
      keyboard, so it needs no tab stop of its own. */
      /* In flow, and stretch-filled: the row's title sets the height and this
      takes all of it, so it can never stretch a parent row the way a fixed
      box taller than the title line did. The svg stays symmetric about its
      own centre, so down and up share one and the toggle spins in place. */
      .card .caret {
        align-self: stretch;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 24px;
        color: var(--dim);
        /* Folded first: down, inviting the press that opens it. */
        transform: rotate(90deg);
        border-radius: 6px;
        transition:
          transform 0.2s ease,
          color 0.15s,
          background 0.15s;
      }
      .card .caret svg {
        display: block;
        width: 14px;
        height: 14px;
      }
      .card .caret:hover {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      /* The lanes' own chevron points right; this one previews its own press:
      down when folded, up when open. */
      .card[aria-expanded='true'] .caret {
        transform: rotate(-90deg);
      }
      .empty {
        color: var(--dim);
        font-size: 11.5px;
        font-style: italic;
        padding: 6px 2px;
      }

      /* ---- board writes: quick-add, drag-and-drop ---------------------------- */
      /* The plus files the next bead. It sits at the lane's far edge, ahead of
      the count, and reads pressed while the composer it opens is showing. */
      .add-bead {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        color: var(--dim);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .add-bead:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .add-bead[aria-expanded='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--panel);
      }
      /* Symmetric strokes, so the plus sits dead centre — a text "+" never
      does, its bearings lifting it off the middle. */
      .add-bead svg {
        display: block;
        width: 12px;
        height: 12px;
      }
      .lane > summary .add-bead {
        margin-left: auto;
      }
      .lane > summary .add-bead ~ .n {
        margin-left: 0;
      }
      /* The composer is a row like any other, so it holds the lane's top spot
      rather than floating above it — but it isn't a button, so it doesn't
      hover or open a sheet. */
      .composer {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
      }
      .composer input[type='text'],
      .composer textarea {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 12.5px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
      }
      .composer input[type='text']:focus,
      .composer textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .composer textarea {
        resize: vertical;
        min-height: 52px;
        line-height: 1.5;
      }
      .composer-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .composer-row.actions {
        align-items: center;
        justify-content: flex-end;
      }
      .composer .form-error {
        margin-right: auto;
        font-size: 11px;
        color: var(--fail);
      }
      /* A native radio group would read as a form; this reads as a setting —
      one press picks the priority, and the pressed segment fills like .mini's. */
      .seg {
        display: inline-flex;
        flex: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        font: inherit;
        font-size: 11px;
        font-weight: 620;
        color: var(--dim);
        background: none;
        border: 0;
        border-left: 1px solid var(--line);
        padding: 6px 10px;
        cursor: pointer;
      }
      .seg button:first-child {
        border-left: 0;
      }
      .seg button:hover {
        color: var(--accent);
      }
      .seg button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--panel);
      }
      /* The label field owns its suggestions: the dropdown hangs off the field
      rather than the row, so a narrow lane doesn't squeeze it. */
      .labels-wrap {
        position: relative;
        flex: 1;
        min-width: 160px;
      }
      .suggest {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        z-index: 30;
        max-height: 152px;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 4px;
      }
      .suggest button {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 6px;
        padding: 5px 8px;
        cursor: pointer;
      }
      .suggest button:hover {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
      }
      /* A card mid-drag goes pale; a lane that will take it draws a dashed
      outline around its cards, not its header, so the eye lands where the
      bead would. */
      .card.dragging {
        opacity: 0.4;
      }
      .lane.drop-hint .lane-cards,
      .strip.drop-hint {
        outline: 2px dashed var(--accent);
        outline-offset: -2px;
      }
      /* A failed write says so and leaves. The board snaps back to the
      server's state on the next poll; the toast is the only trace. */
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        max-width: min(480px, calc(100vw - 32px));
        font-size: 12.5px;
        color: var(--fail);
        background: var(--panel);
        border: 1px solid var(--fail);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 9px 14px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 4px 0;
        font-size: 12px;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row .v {
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
        text-align: right;
      }
      .v.ok {
        color: var(--ok);
      }
      .v.bad {
        color: var(--fail);
      }
      .v.warn {
        color: var(--warn);
      }
      .name {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }

      /* run controls */
      .runs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .runs button {
        font: inherit;
        font-size: 12px;
        font-weight: 560;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: border-color 0.15s;
      }
      .runs button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .runs button:disabled {
        cursor: progress;
        color: var(--dim);
      }
      .runs button i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--idle);
        flex: none;
      }
      .runs button.running i {
        background: var(--warn);
        animation: beat 1s ease-in-out infinite;
      }
      .runs button.ok i {
        background: var(--ok);
      }
      .runs button.failed i {
        background: var(--fail);
      }
      .run-note {
        font-size: 11.5px;
        color: var(--dim);
        margin-bottom: 9px;
        overflow-wrap: anywhere;
      }

      /* the "i" affordance: an explanation you read once doesn't earn permanent space */
      /* The title is the control: the chevron next to it says there's more here,
     and either half opens it. Opened by a press rather than a hover, because
     what's inside is read, not glanced at — a panel that evaporates when the
     pointer drifts can't be. */
      .titlemenu {
        position: relative;
        display: inline-flex;
        align-items: baseline;
      }
      .titletrigger {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .titletrigger .chev {
        color: var(--dim);
        font-size: 13px;
        display: inline-block;
        transform: rotate(90deg);
        transition:
          transform 0.22s ease,
          color 0.15s;
      }
      .titletrigger:hover .chev {
        color: var(--accent);
      }
      .titlemenu.open .chev {
        transform: rotate(-90deg);
      }

      .tip {
        position: absolute;
        top: 100%;
        z-index: 40;
        max-width: calc(100vw - 28px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 12px 14px;
        white-space: normal;
        cursor: default;
        font:
          400 12px/1.5 ui-sans-serif,
          -apple-system,
          system-ui,
          sans-serif;
        text-transform: none;
        letter-spacing: normal;
        color: var(--ink);
        text-align: left;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-3px);
        transition:
          opacity 0.14s ease,
          transform 0.14s ease,
          visibility 0.14s;
      }
      /* Anchored to its left edge: it hangs under the title, which is the far left
     of the page, so a panel measured from its right ran off the screen. */
      .titlemenu .tip {
        left: 0;
        width: min(360px, calc(100vw - 32px));
        margin-top: 6px;
      }
      .titlemenu.open .tip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .lane-name .tip {
        left: -12px;
        width: 268px;
      }
      .lane-name.hoverable:hover .tip,
      .lane-name.hoverable:focus-visible .tip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .tip h3 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-weight: 620;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0 0 7px;
      }
      /* A control in a hover pane: the pane is a child of its anchor, so the
     pointer never leaves the anchor on the way to the button. */
      .tip h3 .mini {
        margin-left: auto;
      }
      .tip .group + .group {
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
      }
      .bar {
        display: flex;
        height: 8px;
        border-radius: 5px;
        overflow: hidden;
        margin: 0 0 8px;
        background: var(--line);
      }
      .bar span {
        display: block;
      }
      .legend {
        display: flex;
        gap: 12px;
        font-size: 11px;
        color: var(--dim);
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .note {
        color: var(--dim);
        font-size: 11px;
        margin-top: 9px;
        font-weight: 400;
      }
      .save b {
        color: var(--ok);
      }

      /* ---- backlog ---------------------------------------------------------- */
      /* <details> is the disclosure control the platform already ships: open state,
     keyboard, and the summary's role come free. Collapsed is the default
     because backlog is the work deliberately not being done next. */
      .backlog {
        margin-bottom: 18px;
      }
      /* A disclosure's own summary and content carry the padding, so the header can
     hold a full-width rule and the panel doesn't pad what's already padded. */
      /* The clip moves down with them: a lane's title carries a hover popover that
     hangs below the header, and a card that clips its own bounds cut it in half. */
      details.panel {
        padding: 0;
        overflow: visible;
      }
      .lane-cards,
      .strip {
        overflow: hidden;
        border-radius: 0 0 14px 14px;
      }
      details.panel > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 14px 20px;
        list-style: none;
        border-radius: 14px;
      }
      details.panel > summary::-webkit-details-marker {
        display: none;
      }
      details.panel .chev {
        color: var(--dim);
        font-size: 11px;
        transition: transform 0.25s ease;
        display: inline-block;
      }
      details.panel[open] .chev {
        transform: rotate(90deg);
      }
      details.panel > summary .n {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--dim);
      }
      /* Headers are filled bars, so their h2, chevron and count take the bar's
      own ink instead of --ink/--dim. This sits after the rules above on
      purpose: `details.panel > summary .n` ties it on specificity, and the
      later rule wins — from any earlier spot the count stays dim on the fill. */
      details.panel > summary h2,
      details.panel > summary .chev,
      details.panel > summary .n {
        color: inherit;
      }
      /* Rows, like the lanes below it — the backlog is read the same way the rest
     of the ledger is, and it's behind a disclosure, so its length costs nothing
     until it's opened. */
      .strip {
        display: flex;
        flex-direction: column;
      }
      .backlog[open] .strip {
        animation: unfurl 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      }
      @keyframes unfurl {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
      }

      /* ---- the harness ------------------------------------------------------ */
      /* Top to bottom, because this is a sequence: what a session wakes into, then
     where it finds work, then what it has to pass before any of it counts. A
     spine down the left carries the eye between stages so the stack reads as
     one flow rather than seven unrelated lists. */
      .harness {
        margin-top: 18px;
        padding: 0;
      }
      .flow {
        padding: 2px 20px 20px;
      }
      .stage {
        position: relative;
        padding: 0 0 20px 26px;
      }
      .stage::before {
        content: '';
        position: absolute;
        left: 0;
        top: 4px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }
      .stage::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 17px;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }
      .stage:last-child {
        padding-bottom: 0;
      }
      .stage:last-child::after {
        display: none;
      }
      .stage-head {
        display: flex;
        align-items: baseline;
        gap: 9px;
        flex-wrap: wrap;
        margin-bottom: 9px;
      }
      .stage-head b {
        font-size: 11.5px;
        font-weight: 620;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .stage-head span {
        font-size: 11.5px;
        color: var(--dim);
      }
      .nodes {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .node {
        display: flex;
        align-items: center;
        gap: 7px;
        font: inherit;
        font-size: 11.5px;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .node:hover {
        border-color: var(--accent);
      }
      .node:active {
        transform: scale(0.97);
      }
      /* Which half of the system a piece belongs to is the one thing worth seeing
     without opening anything, so it's the only colour in here. */
      .node i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }
      .node.claude i {
        background: var(--accent);
      }
      .node .t {
        color: var(--dim);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }

      /* ---- detail sheet ----------------------------------------------------- */
      /* Rises from the bottom edge and settles in the middle, so the eye still
     follows it up from where it was summoned and back down on dismissal. */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 55;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.3s ease,
          visibility 0.3s;
      }
      .scrim.open {
        opacity: 1;
        visibility: visible;
      }
      .sheet {
        /* --edge is a floor, not a frame: the sheet takes the height its contents
       need and keeps at least this much clear on every side. Both insets are
       set and the height isn't auto, so `margin: auto` centres it in what's
       left. Width still fills the band — only the height hugs. */
        --edge: 54px;
        position: fixed;
        inset: var(--edge);
        margin: auto;
        z-index: 60;
        height: fit-content;
        max-height: calc(100vh - var(--edge) * 2);
        overflow-y: auto;
        /* A bead's title and notes are prose, and prose past this stops being
       readable — on a wide display the sheet centres rather than spanning. */
        max-width: 856px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 14px 52px rgba(0, 0, 0, 0.34);
        visibility: hidden;
        /* A full viewport, because a sheet that hugs its contents can't know where
       its own top will land. The easing is front-loaded, so the part you watch
       is the settle either way. */
        transform: translateY(100vh);
        transition:
          transform 0.44s cubic-bezier(0.32, 0.72, 0, 1),
          visibility 0.44s;
      }
      .sheet.open {
        visibility: visible;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet,
        .scrim {
          transition-duration: 0.01ms;
        }
        .backlog[open] .strip {
          animation: none;
        }
      }
      .sheet h3.title {
        font-size: 17px;
        font-weight: 620;
        margin: 0 0 10px;
        line-height: 1.3;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .sheet .meta {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }
      .sheet .meta code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--dim);
      }
      .sheet section {
        margin-top: 16px;
      }
      /* Direct child only: this styles the section's own label, and a rendered
     document's headings are nested deeper and set their own type. */
      .sheet section > h4 {
        font-size: 10px;
        font-weight: 620;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0 0 7px;
      }
      .sheet p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .sheet .kids {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .sheet .kid {
        display: flex;
        align-items: baseline;
        gap: 9px;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 12.5px;
        color: inherit;
        cursor: pointer;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 11px;
        transition: border-color 0.15s;
      }
      .sheet .kid:hover {
        border-color: var(--accent);
      }
      .sheet .kid.closed {
        color: var(--dim);
      }
      .sheet .kid .tick {
        color: var(--ok);
        flex: none;
      }
      /* No height cap and no scroller of its own: the sheet is the one thing that
     scrolls, so a long file runs its full length instead of pooling in a short
     box with dead space under it. */
      .sheet pre.file {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }

      /* Rendered markdown. Documents here are read, not skimmed, so this is a
     reading column rather than another dense panel. */
      .md {
        font-size: 13.5px;
        line-height: 1.62;
        overflow-wrap: anywhere;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p {
        margin: 0 0 11px;
        white-space: normal;
        font-size: inherit;
      }
      .md h3,
      .md h4,
      .md h5,
      .md h6 {
        font-weight: 620;
        letter-spacing: -0.005em;
        color: var(--ink);
        margin: 22px 0 8px;
        text-transform: none;
      }
      .md h3 {
        font-size: 16px;
      }
      .md h4 {
        font-size: 14px;
      }
      .md h5,
      .md h6 {
        font-size: 12.5px;
        color: var(--dim);
      }
      .md ul,
      .md ol {
        margin: 0 0 11px;
        padding-left: 20px;
      }
      .md li {
        margin: 0 0 5px;
      }
      .md li::marker {
        color: var(--dim);
      }
      /* A list item holding several paragraphs is the shape these documents use
     most; without this its prose sits flush against the next item. */
      .md li > p {
        margin-bottom: 8px;
      }
      .md li > :last-child {
        margin-bottom: 0;
      }
      .md strong {
        font-weight: 620;
      }
      .md a {
        color: var(--accent);
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      .md blockquote {
        margin: 0 0 11px;
        padding: 2px 0 2px 13px;
        border-left: 2px solid var(--line);
        color: var(--dim);
      }
      .md code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 4px;
      }
      .md pre {
        margin: 0 0 13px;
        padding: 11px 13px;
        overflow-x: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.5;
      }
      /* A code block's own <code> child would otherwise get the inline chip. */
      .md pre code {
        background: none;
        border: 0;
        padding: 0;
        font-size: inherit;
      }
      /* Frontmatter is the file's own bookkeeping — present, and visibly not prose. */
      .md pre.front {
        color: var(--dim);
        font-size: 10.5px;
        margin-bottom: 18px;
      }
      .sheet .close {
        position: sticky;
        top: 0;
        float: right;
        margin: 14px 14px 0 0;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        color: var(--dim);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 8px;
      }
      /* The diff header carries its own close button, right in the row next to
     undo rather than floating outside it — the generic one would either sit
     stranded above a flush header or get painted over by it. */
      .sheet:has(#sheetBody.flush) .close {
        display: none;
      }
      /* The sheet itself carries no padding any more — a diff's own header needs
     to run flush to every edge to stay opaque over content scrolling under it,
     which a shared ambient inset would fight. Ordinary sheets (a bead, a
     harness node) get their padding here instead; the diff sheet skips it via
     `.flush` and paddings its own pieces individually. */
      #sheetBody {
        padding: 20px 22px 26px;
      }
      #sheetBody.flush {
        padding: 0;
      }
      .sheet .close:hover {
        color: var(--ink);
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="titlemenu" id="titlemenu">
        <button class="titletrigger" id="metaToggle" aria-expanded="false" aria-controls="metaTip">
          <h1 id="projectName"></h1>
          <span class="chev">›</span>
        </button>
        <span
          class="tip"
          id="metaTip"
          role="region"
          aria-label="Context budget, ledger health, and capabilities"
        ></span>
      </span>
      <span class="meta-line">
        <span class="sub" id="branchline">—</span>
        <span class="dot">·</span>
        <span class="gate hoverable" id="gate" tabindex="0" role="note" aria-label="Gate detail">
          <span id="gateLabel">—</span>
          <span class="tip" id="verifyTip"></span>
        </span>
        <span class="dot">·</span>
        <span class="pulse" id="pulse" tabindex="0" role="note" aria-label="Connection">
          <span id="pulseLabel">connecting</span>
          <span class="tip" id="pulseTip"></span>
        </span>
      </span>
      <div class="runs" id="runs"></div>
    </header>

    <details class="panel backlog" id="backlog" hidden>
      <summary>
        <span class="chev">›</span>
        <h2>backlog</h2>
        <span class="n" id="backlogCount"></span>
      </summary>
      <div class="strip" id="backlogStrip" data-drop="backlog"></div>
    </details>

    <div class="board" id="board"></div>

    <!-- Static overlays for the work-tree row actions. A single instance of each,
         repositioned over whichever row was pressed — the rows themselves are
         thrown away and rebuilt on every board repaint, and anything stateful
         (typed commit text, an open confirm) living inside one would vanish or
         reset out from under the reader mid-use. -->
    <div class="popconfirm" id="revertConfirm" hidden role="dialog" aria-label="Confirm revert">
      <p>revert changes to <b id="revertConfirmName"></b>?</p>
      <div class="actions">
        <button class="mini" id="revertCancel" type="button">cancel</button>
        <button class="mini danger" id="revertConfirmBtn" type="button">revert</button>
      </div>
    </div>

    <div class="popmenu" id="fileMenu" hidden role="menu" aria-label="File actions">
      <button role="menuitem" id="fileMenuReveal" type="button">show in Finder</button>
      <button role="menuitem" id="fileMenuVscode" type="button">open in VS Code</button>
    </div>

    <div class="popover commit-pop" id="commitPop" hidden role="dialog" aria-label="Compose commit">
      <textarea id="commitMsg" rows="3" placeholder="commit message…"></textarea>
      <div class="commit-actions">
        <label class="commit-amend"><input type="checkbox" id="commitAmend" />amend</label>
        <button class="mini" id="commitSubmit" type="button">commit</button>
      </div>
      <div class="commit-error" id="commitError" hidden></div>
    </div>

    <details class="panel harness" id="harness">
      <summary>
        <span class="chev">›</span>
        <h2>the harness</h2>
        <span class="n" id="harnessCount"></span>
      </summary>
      <div class="flow" id="harnessFlow"></div>
    </details>

    <div class="scrim" id="scrim"></div>
    <div class="toast" id="toast" hidden role="status"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="close" id="sheetClose" aria-label="Close detail">✕</button>
      <div id="sheetBody"></div>
    </aside>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/diff2html.min.js"></script>
    <!-- Registers its grammars on load; swift, python and bash are all in here. -->
    <script src="vendor/highlight.min.js"></script>
    <script>
      const $ = (id) => document.getElementById(id)
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c])
      const row = (label, value, cls = '') =>
        `<div class="row"><span class="name">${esc(label)}</span><span class="v ${cls}">${esc(value)}</span></div>`

      /* ---- the board -------------------------------------------------------- */
      /* Bead lanes hold work. Stage lanes hold the state of the machinery the work
         has to pass through — they report rather than accumulate, which is why they
         carry one card instead of a stack. */
      const BEAD_LANES = [
        ['ready', 'ready'],
        ['blocked', 'blocked'],
        ['in_progress', 'in progress'],
        ['review', 'review'],
        ['staging', 'staging'],
      ]

      let boardSignature = ''
      let backlogSignature = ''

      /* Which lanes the reader has folded away, and how far they've opened the long
         ones. Both live here rather than in the DOM because the board is rebuilt from
         scratch whenever the ledger changes, and a rebuild that forgets these would
         re-open a lane you just closed. */
      const foldedLanes = new Set()
      const laneLimits = {}
      const LANE_PAGE = 8

      /* Which parents are expanded inline by the caret on their row. In memory
      beside the folds above, so a polling repaint keeps them open; everything
      starts collapsed on load. */
      const expandedEpics = new Set()

      /* Run buttons are described once, in dashboard.toml beside the server, and
         arrive here inside the state with their label and their placement. The
         page draws slots; it never names a task. */
      let runStates = {}

      function runButton(key) {
        const r = runStates[key]
        if (!r) return ''
        const busy = r.state === 'running'
        // The header strip styles its own buttons and shows a status dot; the
        // gate and the lanes borrow .mini from everything else on that row.
        const header = r.where === 'header'
        return `<button data-task="${esc(key)}" class="${header ? '' : 'mini '}${r.state}"
          ${busy ? 'disabled' : ''}>${header ? '<i></i>' : ''}${esc(busy ? r.busy : r.label)}</button>`
      }

      const runSlot = (where) =>
        Object.keys(runStates)
          .filter((k) => runStates[k].where === where)
          .map(runButton)
          .join('')

      /* Everything the board and the sheet both need to know about the ledger. */
      let ledger = {byId: {}, epicName: () => ''}

      /* Staging takes closed beads, but a commit can name one that's still open —
         a handoff note referencing work in progress is the usual case. Those
         commits are pending all the same, so the lane names the beads rather than
         standing there empty above a push button. */
      function stagingNote(d) {
        const open = (d.git.unpushed_beads || []).filter((id) => (ledger.byId[id] || {}).status !== 'closed')
        if (!open.length) return ''
        return `In-progress beads with commits ready to push: ${open.join(', ')}`
      }

      function beadCard(i, kid = false) {
        const waiting = (i.deps || []).filter((x) => {
          const dep = ledger.byId[x]
          return dep && dep.status !== 'closed'
        })
        const kids = i.children || []
        // Inline children sit directly under their parent, so they skip the
        // pill that would only repeat the row above.
        const parent = ledger.epicName(i.parent)
        const hasKids = kids.length > 0
        const open = hasKids && expandedEpics.has(i.id)
        // Draggable: a card can be dropped on another lane's cards to move it
        // there. The drop zones live on the lanes; the click handler knows to
        // ignore the press that ends a drag rather than opening the sheet.
        return `<button class="card${kid ? ' kid' : ''}" data-bead="${esc(i.id)}" draggable="true"
          ${hasKids ? `data-has-kids aria-expanded="${open}"` : ''}>
          <span class="chip id" title="${esc(i.id)}">${esc(i.id.slice(-3))}</span>
          <span class="chip prio">P${esc(i.priority)}</span>
          <b>${esc(i.title)}</b>
          <div class="meta">
            ${i.type !== 'task' ? `<span class="chip">${esc(i.type)}</span>` : ''}
            ${!kid && parent ? `<span class="chip epic">${esc(parent)}</span>` : ''}
            ${kids.length ? `<span class="chip">${kids.length} sub-bead${kids.length === 1 ? '' : 's'}</span>` : ''}
            ${i.commit_count ? `<span>${i.commit_count} commit${i.commit_count === 1 ? '' : 's'}</span>` : ''}
            ${waiting.length ? `<span class="waits">waits on ${waiting.map(esc).join(', ')}</span>` : ''}
          </div>
          ${hasKids ? `<span class="caret" data-expand="${esc(i.id)}" aria-hidden="true" title="${open ? 'Hide' : 'Show'} sub-beads"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : ''}
        </button>`
      }

      /* A parent's children inline: the same rows, as flat siblings of the
      parent rather than indented ones, told apart by the darker fill.
      Depth-first, so a child that is itself a parent carries its own subtree
      right under it. With a lane key, only children in that same state come
      along — without one (the backlog has no state to match) the whole family
      does. The seen set keeps a bead that is both listed and nested
      (the backlog names children outright) to its first appearance. */
      function renderTree(list, laneKey = '') {
        const out = []
        const seen = new Set()
        const walk = (i, kid) => {
          if (!i || seen.has(i.id)) return
          if (kid && laneKey && ledger.laneOf(i) !== laneKey) return
          seen.add(i.id)
          out.push(beadCard(i, kid))
          if (!expandedEpics.has(i.id)) return
          ;(i.children || [])
            .map((id) => ledger.byId[id])
            .filter(Boolean)
            .sort((a, b) => a.priority - b.priority)
            .forEach((k) => walk(k, true))
        }
        list.forEach((i) => walk(i, false))
        return out.join('')
      }

      /* The last ledger the board was drawn from, so a press that only changes how
         much of a lane is showing can repaint without waiting for the next poll. */
      let lastLedger = null
      function redrawBoard() {
        if (lastLedger) drawBoard(lastLedger)
      }
      /* The deliberate kind of repaint: a press the reader made (opening the
         composer, finishing a drag) paints at once, while a poll arriving
         mid-draft or mid-drag only refreshes the lookup tables and leaves the
         DOM — typed text, focus, the lane under the pointer — alone. */
      function paintNow() {
        if (!lastLedger) return
        drawBoard(lastLedger, true)
        drawBacklog(lastLedger, true)
      }

      function drawBoard(d, force = false) {
        lastLedger = d
        const all = d.ledger.issues
        ledger.byId = Object.fromEntries(all.map((i) => [i.id, i]))
        ledger.epicName = (id) => (ledger.byId[id] || {}).title || ''
        // Review outranks the others: a bead being reviewed is in review, whatever
        // else is true of it. Staging is a subset of closed, not every bead named in
        // an unpushed commit — a handoff note that mentions a still-open bead for
        // context shouldn't drag it out of its real lane.
        const pushedPending = new Set(d.git.unpushed_beads || [])
        const lane = (i) =>
          i.status === 'closed' && pushedPending.has(i.id)
            ? 'staging'
            : i.status === 'closed'
              ? 'done'
              : i.in_review
                ? 'review'
                : i.status === 'in_progress'
                  ? 'in_progress'
                  : i.ready
                    ? 'ready'
                    : 'blocked'

        // renderTree reads this to keep an expanded family to the lane being
        // drawn — a child in another state stays in its own lane, subtree and
        // all, rather than trailing its parent around the board.
        ledger.laneOf = lane

        // A parent stands for its children on the board — six cards that are one
        // piece of work read as six pieces of work. The children are in the parent's
        // sheet, where the relationship is legible. Backlog has its own strip.
        const cards = all.filter((i) => !ledger.byId[i.parent] && !i.backlog)
        const beadLanes = BEAD_LANES.map(([key, label]) => {
          // Staging keeps the recency order it's always had — it reports
          // which pushes are pending, not what to work on next. Every other
          // lane is a worklist, so it reads top to bottom by priority.
          const items = cards
            .filter((i) => lane(i) === key)
            .sort((a, b) => (key === 'staging' ? 0 : a.priority - b.priority))
          const tip = {review: 'reviewTip', staging: 'commitTip'}[key] || ''
          return {
            key,
            label,
            count: items.length,
            hover: tip,
            // Whether the lane offers a button at all is the lane's business —
            // nothing to push, nothing to press. Which button, and what it says,
            // is the server's.
            slot: key === 'staging' && (d.git.unpushed || []).length ? 'lane:staging' : '',
            note: key === 'staging' && !items.length ? stagingNote(d) : '',
            items,
          }
        })
        // The raw working copy sits next to staging — the two lanes together are
        // the whole story of what a commit right now would take. Spliced in
        // rather than added to BEAD_LANES: it's not a bead lane, it carries no
        // `items`/`slot` shape the rest of that pipeline understands.
        beadLanes.splice(beadLanes.findIndex((l) => l.key === 'staging'), 0, {key: 'worktree', worktree: true})

        // The sheet's own lookup table, kept current whether or not the board
        // below ends up repainting — a diff sheet already open has to see a
        // staged/unstaged flip even on a poll where no bead moved lanes.
        worktree.byPath = Object.fromEntries((d.worktree || []).map((e) => [e.path, e]))

        // A composer holds typed text and a drag holds a bead: a poll that
        // repaints now would wipe the draft mid-word or move the lane under
        // the pointer. The tables above stay current; the paint waits for an
        // explicit press (paintNow) or the end of the gesture.
        if (!force && (composerOpen || draggedId)) return

        const lanes = [
          ...beadLanes,
          {key: 'done', label: 'done', count: d.ledger.counts.closed, items: cards.filter((i) => lane(i) === 'done')},
          // An empty lane says nothing worth the room it takes. Staging is the
          // exception: with commits to push it carries the button that pushes them,
          // and that has to stay reachable whether or not a bead sits under it.
          // Ready is the other: the plus that files the next bead lives in its
          // header, and an empty worklist is news rather than nothing.
        ].filter((l) => l.key === 'ready' || (l.worktree ? (d.worktree || []).length : l.items.length || l.slot))

        // Rebuilt only when something changed: two lanes carry hover popovers, and
        // replacing one under the pointer would close it mid-read.
        //
        // Fingerprinted on the markup rather than on which beads are in which lane —
        // a bead renamed in place, or one whose blocker just closed, moves no lane and
        // would otherwise sit there stale until something else forced a repaint. The
        // markup also carries the fold and the load-more limit, so those need no
        // separate accounting.
        const rendered = lanes.map((l) => ({key: l.key, html: l.worktree ? worktreeLane(d) : laneCard(l)}))
        const signature = JSON.stringify(rendered)
        if (signature === boardSignature) return
        boardSignature = signature

        paintBoard(rendered)
      }

      /* Lanes are swapped in place rather than the board being thrown away, so one
         arriving or leaving can be animated while the rest hold still. */
      function paintBoard(rendered) {
        const board = $('board')
        const keys = new Set(rendered.map((l) => l.key))
        const leaving = [...board.children].filter((el) => el.dataset.lane && !keys.has(el.dataset.lane))

        const paint = () => {
          const had = new Set([...board.children].map((el) => el.dataset.lane))
          board.innerHTML = rendered.map((l) => l.html).join('') || '<div class="empty">nothing in the ledger</div>'
          for (const el of board.children) {
            if (el.dataset.lane && !had.has(el.dataset.lane)) el.classList.add('entering')
          }
        }

        // Nothing left: repaint now, and let whatever is new grow in.
        if (!leaving.length) return paint()
        leaving.forEach((el) => el.classList.add('leaving'))
        setTimeout(paint, 220)
      }

      /* ---- board writes: quick-add composer --------------------------------- */
      /* The composer's text lives here, not in the DOM: the board repaints from
         polls every few seconds, and inputs that only existed in the DOM would
         lose a half-typed title to the next one. Every keystroke writes through
         to `draft`, so a repaint rebuilds the same words — and while the
         composer is open polls don't repaint at all (see drawBoard), so focus
         survives too. */
      let composerOpen = false
      let composerSaving = false
      let composerError = ''
      let draft = {title: '', description: '', labels: '', priority: 2}

      /* Lanes a card can be dropped on. Staging and the work tree report
         derived state — unpushed commits, the raw working copy — so there is
         nothing to drop onto; everything else is a real place a bead can be.
         Backlog's zone is the strip's own data-drop below rather than a lane
         card, and the server's MOVE_LANES is the third copy — a lane added in
         one place needs adding in all three. */
      const DROP_LANES = new Set(['ready', 'blocked', 'in_progress', 'review', 'done', 'backlog'])

      function composerHtml() {
        const segs = [0, 1, 2, 3, 4]
          .map(
            (p) =>
              `<button type="button" data-prio="${p}" aria-pressed="${draft.priority === p}" title="P${p}">P${p}</button>`,
          )
          .join('')
        return `
          <div class="composer" id="composer">
            <input id="composerTitle" type="text" placeholder="bead title…" value="${esc(draft.title)}"
              maxlength="300" aria-label="Title" ${composerSaving ? 'disabled' : ''} />
            <textarea id="composerDesc" placeholder="description (optional)" aria-label="Description"
              ${composerSaving ? 'disabled' : ''}>${esc(draft.description)}</textarea>
            <div class="composer-row">
              <div class="labels-wrap">
                <input id="composerLabels" type="text" placeholder="labels, comma-separated" value="${esc(draft.labels)}"
                  aria-label="Labels" autocomplete="off" aria-expanded="false" aria-controls="composerSuggest"
                  ${composerSaving ? 'disabled' : ''} />
                <div class="suggest" id="composerSuggest" role="listbox" aria-label="Label suggestions" hidden></div>
              </div>
              <div class="seg" role="group" aria-label="Priority">${segs}</div>
            </div>
            <div class="composer-row actions">
              <span class="form-error">${esc(composerError)}</span>
              <button class="mini" type="button" data-composer-cancel ${composerSaving ? 'disabled' : ''}>cancel</button>
              <button class="mini" type="button" data-composer-save ${composerSaving ? 'disabled' : ''}>
                ${composerSaving ? 'saving…' : 'save'}</button>
            </div>
          </div>`
      }

      /* What the label field suggests. The server sends every label in the
         ledger, so a ledger whose labels all sit on closed beads still
         suggests them; the fallback derives them for a server from before. */
      function allLabels() {
        if (lastLedger?.ledger?.all_labels?.length) return lastLedger.ledger.all_labels
        const seen = new Set()
        for (const i of lastLedger?.ledger?.issues || []) for (const l of i.labels || []) seen.add(l)
        return [...seen].sort()
      }

      function renderSuggestions(input) {
        const box = $('composerSuggest')
        if (!input || !box) return
        const parts = input.value.split(',')
        const token = (parts.pop() || '').trim().toLowerCase()
        const used = new Set(parts.map((s) => s.trim().toLowerCase()).filter(Boolean))
        const matches = allLabels()
          .filter((l) => !used.has(l.toLowerCase()) && (!token || l.toLowerCase().includes(token)))
          .slice(0, 8)
        if (!matches.length) {
          box.hidden = true
          box.innerHTML = ''
          input.setAttribute('aria-expanded', 'false')
          return
        }
        box.innerHTML = matches
          .map((m) => `<button type="button" role="option" data-suggest="${esc(m)}">${esc(m)}</button>`)
          .join('')
        box.hidden = false
        input.setAttribute('aria-expanded', 'true')
      }

      function hideSuggestions() {
        const box = $('composerSuggest')
        if (box) {
          box.hidden = true
          box.innerHTML = ''
        }
        $('composerLabels')?.setAttribute('aria-expanded', 'false')
      }

      function openComposer() {
        composerOpen = true
        composerError = ''
        // The composer renders at the top of ready's cards, which a folded
        // lane would hide — opening it unfolds the lane it lives in.
        foldedLanes.delete('ready')
        paintNow()
        requestAnimationFrame(() => $('composerTitle')?.focus())
      }

      function cancelComposer() {
        composerOpen = false
        composerSaving = false
        composerError = ''
        draft = {title: '', description: '', labels: '', priority: 2}
        paintNow()
      }

      async function saveComposer() {
        const title = draft.title.trim()
        const errEl = document.querySelector('#composer .form-error')
        if (!title) {
          if (errEl) errEl.textContent = 'a bead needs a title'
          $('composerTitle')?.focus()
          return
        }
        composerSaving = true
        if (errEl) errEl.textContent = ''
        const btn = document.querySelector('[data-composer-save]')
        if (btn) btn.disabled = true
        const labels = draft.labels
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean)
        try {
          const r = await (
            await fetch('beads/create', {
              method: 'POST',
              body: JSON.stringify({title, description: draft.description.trim(), labels, priority: draft.priority}),
            })
          ).json()
          if (r.ok) {
            cancelComposer()
            tick()
          } else {
            composerSaving = false
            if (errEl) errEl.textContent = r.error || 'create failed'
            if (btn) btn.disabled = false
          }
        } catch {
          composerSaving = false
          if (errEl) errEl.textContent = "nothing is serving this page, so the bead wasn't filed"
          if (btn) btn.disabled = false
        }
      }

      /* A failed write says so and leaves. The board snaps back to the
         server's state on the next poll; the toast is the only trace. */
      let toastTimer = 0
      function toast(msg) {
        const t = $('toast')
        if (!t) return
        t.textContent = msg
        t.hidden = false
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => (t.hidden = true), 4500)
      }

      /* ---- board writes: drag-and-drop ------------------------------------ */
      /* Native HTML5 drag, not a library: five lanes, one gesture, no touch
         story needed for a page that lives in a desktop browser pane. The
         lanes don't repaint mid-drag (see drawBoard), so the drop zone can't
         move under the pointer. */
      let draggedId = null
      let draggedNode = null
      // A timestamp, not a flag: the click that ends a drag must be ignored,
      // and only just after the drag — compared against Date.now(), below.
      let lastDragEnd = 0
      /* A press that begins on a caret is an expansion, not the start of a
      move — but dragstart fires on the draggable card, and `closest` only
      walks up, so the handler can't see the caret from there. The mousedown
      below remembers where the press began; dragstart reads that instead. A
      suppressed press that still travels counts as a drag attempt, and the
      click ending it is swallowed rather than toggling. */
      let caretDown = null
      let caretSwallowed = false

      function clearDropState() {
        document.querySelectorAll('.dragging').forEach((el) => el.classList.remove('dragging'))
        document.querySelectorAll('.drop-hint').forEach((el) => el.classList.remove('drop-hint'))
      }

      function dragSourceLane(id) {
        // The node the drag started from, not the first match in the document:
        // a bead shown twice (a backlog child under its expanded board parent)
        // must report the lane it was actually picked up from. Falls back to
        // the lookup for presses that never passed through dragstart.
        const card =
          draggedNode && draggedNode.dataset.bead === id
            ? draggedNode

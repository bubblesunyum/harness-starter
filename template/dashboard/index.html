      (the backlog names children outright) to its first appearance. */
      const beadParents = (i) => i.parents || (i.parent ? [i.parent] : [])

      function renderTree(list, laneKey = '') {
        const out = []
        const seen = new Set()
        const walk = (i, kid) => {
          if (!i || seen.has(i.id)) return
          if (laneKey === 'backlog' ? !i.backlog : laneKey && !ledger.lanesOf(i).has(laneKey)) return
          seen.add(i.id)
          out.push(beadCard(i, kid))
          if (!expandedEpics.has(i.id)) return
          ;(i.children || [])
            .map((id) => ledger.byId[id])
            .filter(Boolean)
            .sort((a, b) => a.priority - b.priority)
            .forEach((k) => walk(k, true))
        }
        list.forEach((i) => walk(i, false))
        return out.join('')
      }

      /* Shelving lives on the server: ledger_state inherits backlog down the
      parent chain into `backlog`, so the view filters on the flag rather
      than re-walking the chain (a local walk over untyped deps overreaches
      where the server walks parent links only). */

      /* The last ledger the board was drawn from, so a press that only changes how
         much of a lane is showing can repaint without waiting for the next poll. */
      let lastLedger = null
      function redrawBoard() {
        if (lastLedger) drawBoard(lastLedger)
      }
      /* The deliberate kind of repaint: a press the reader made (opening the
         composer, finishing a drag) paints at once, while a poll arriving
         mid-draft or mid-drag only refreshes the lookup tables and leaves the
         DOM — typed text, focus, the lane under the pointer — alone. */
      function paintNow() {
        if (!lastLedger) return
        drawBoard(lastLedger, true)
        drawBacklog(lastLedger, true)
      }

      function drawBoard(d, force = false) {
        lastLedger = d
        // Project layout for this repaint: hidden sections never reach the
        // paint, listed ones lead in listed order (see orderSections below).
        const layout = boardConfig(d)
        // No `bd` on PATH is not an empty ledger — it is no ledger. The lanes
        // vanish rather than standing there saying "nothing", and the work-tree
        // lane (which comes from git, not bd) is the only one allowed through.
        const noLedger = !d.ledger || d.ledger.available === false
        const all = (d.ledger && d.ledger.issues) || []
        ledger.byId = Object.fromEntries(all.map((i) => [i.id, i]))
        ledger.epicName = (id) => (ledger.byId[id] || {}).title || ''
        const pushedPending = new Set(d.git.unpushed_beads || [])
        // A bead's own lane, before its children get a say. Review outranks
        // the others: a bead being reviewed is in review, whatever else is
        // true of it. Staging is a subset of closed, not every bead named in
        // an unpushed commit — a handoff note that mentions a still-open bead
        // for context shouldn't drag it out of its real lane.
        const own = (i) =>
          i.status === 'closed' && pushedPending.has(i.id)
            ? 'staging'
            : i.status === 'closed'
              ? 'done'
              : i.in_review
                ? 'review'
                : i.status === 'in_progress'
                  ? 'in_progress'
                  : i.ready
                    ? 'ready'
                    : 'blocked'

        // A family appears wherever it has work. Each ancestor carries its
        // descendants' lanes so a nested ready bead remains reachable beside
        // its blocked or in-progress siblings. Shelved work stays on its strip.
        const memberships = new Map()
        const lanesOf = (i, seen = new Set()) => {
          if (i.backlog) return new Set()
          if (memberships.has(i.id)) return memberships.get(i.id)
          const lanes = new Set([own(i)])
          if (seen.has(i.id)) return lanes
          const path = new Set(seen).add(i.id)
          for (const id of i.children || []) {
            const child = ledger.byId[id]
            if (child) for (const key of lanesOf(child, path)) lanes.add(key)
          }
          memberships.set(i.id, lanes)
          return lanes
        }
        ledger.laneOf = own
        ledger.lanesOf = lanesOf

        const cards = all.filter((i) => !beadParents(i).some((id) => ledger.byId[id]) && !i.backlog)
        const beadLanes = BEAD_LANES.map(([key, label]) => {
          // Staging keeps the recency order it's always had — it reports
          // which pushes are pending, not what to work on next. Every other
          // lane is a worklist, so it reads top to bottom by priority.
          const items = cards
            .filter((i) => lanesOf(i).has(key))
            .sort((a, b) => (key === 'staging' ? 0 : a.priority - b.priority))
          const tip = {review: 'reviewTip', staging: 'commitTip'}[key] || ''
          return {
            key,
            label,
            count: items.length,
            hover: tip,
            // Whether the lane offers a button at all is the lane's business —
            // nothing to push, nothing to press. Which button, and what it says,
            // is the server's.
            slot: key === 'staging' && (d.git.unpushed || []).length ? 'lane:staging' : '',
            note: key === 'staging' && !items.length ? stagingNote(d) : '',
            items,
          }
        })
        // The raw working copy sits next to staging — the two lanes together are
        // the whole story of what a commit right now would take. Spliced in
        // rather than added to BEAD_LANES: it's not a bead lane, it carries no
        // `items`/`slot` shape the rest of that pipeline understands.
        beadLanes.splice(beadLanes.findIndex((l) => l.key === 'staging'), 0, {key: 'worktree', worktree: true})

        // The sheet's own lookup table, kept current whether or not the board
        // below ends up repainting — a diff sheet already open has to see a
        // staged/unstaged flip even on a poll where no bead moved lanes.
        worktree.byPath = Object.fromEntries((d.worktree || []).map((e) => [e.path, e]))

        // A composer holds typed text and a drag holds a bead: a poll that
        // repaints now would wipe the draft mid-word or move the lane under
        // the pointer. The tables above stay current; the paint waits for an
        // explicit press (paintNow) or the end of the gesture.
        if (!force && (composerOpen || draggedId)) return

        // Counts name the families rendered in each section.
        const doneItems = cards.filter((i) => lanesOf(i).has('done'))
        const candidates = [
          ...beadLanes,
          {key: 'done', label: 'done', count: doneItems.length, items: doneItems},
          // An empty lane says nothing worth the room it takes. Staging is the
          // exception: with commits to push it carries the button that pushes them,
          // and that has to stay reachable whether or not a bead sits under it.
          // Ready is the other: the plus that files the next bead lives in its
          // header, and an empty worklist is news rather than nothing.
          // Neither exception applies with no ledger behind them.
        ]
        const lanes = candidates.filter(
          (l) =>
            !layout.hidden.has(l.key) &&
            (noLedger
              ? !!l.worktree
              : l.key === 'ready' || (l.worktree ? (d.worktree || []).length : l.items.length || l.slot)),
        )
        // Every lane hidden is a choice, not an empty ledger — no "nothing" text.
        // Same when only some lanes hide but the hidden ones hold the work: the
        // ledger isn't empty, it's configured out of sight. Counts already name
        // each lane's families, so no lane walk is needed to ask.
        const hiddenWork = (l) =>
          layout.hidden.has(l.key) &&
          (l.worktree ? (d.worktree || []).length : l.items.length)
        const allHidden = !lanes.length && candidates.every((l) => layout.hidden.has(l.key))
        const someHiddenWork = !lanes.length && !allHidden && candidates.some(hiddenWork)

        // Rebuilt only when something changed: two lanes carry hover popovers, and
        // replacing one under the pointer would close it mid-read.
        //
        // Fingerprinted on the markup rather than on which beads are in which lane —
        // a bead renamed in place, or one whose blocker just closed, moves no lane and
        // would otherwise sit there stale until something else forced a repaint. The
        // markup also carries the fold and the load-more limit, so those need no
        // separate accounting.
        const rendered = orderSections(lanes, layout.order).map((l) => ({
          key: l.key,
          html: l.worktree ? worktreeLane(d) : laneCard(l),
        }))
        const signature = JSON.stringify(rendered)
        if (signature === boardSignature) return
        boardSignature = signature

        paintBoard(rendered, noLedger, allHidden || someHiddenWork)
      }

      /* Lanes are swapped in place rather than the board being thrown away, so one
         arriving or leaving can be animated while the rest hold still. */
      // noLedger rides along because a paint can be empty now — every lane
      // hidden, or no ledger behind a clean tree — and the outer scope's flag
      // doesn't exist here, so reading it would throw on exactly that paint.
      function paintBoard(rendered, noLedger = false, allHidden = false) {
        const board = $('board')
        const keys = new Set(rendered.map((l) => l.key))
        const leaving = [...board.children].filter((el) => el.dataset.lane && !keys.has(el.dataset.lane))

        const paint = () => {
          const had = new Set([...board.children].map((el) => el.dataset.lane))
          // With no ledger there is no "nothing in the ledger" either — the
          // board is just the work tree, or nothing at all.
          board.innerHTML =
            rendered.map((l) => l.html).join('') ||
            (noLedger || allHidden ? '' : '<div class="empty">nothing in the ledger</div>')
          for (const el of board.children) {
            if (el.dataset.lane && !had.has(el.dataset.lane)) el.classList.add('entering')
          }
        }

        // Nothing left: repaint now, and let whatever is new grow in.
        if (!leaving.length) return paint()
        leaving.forEach((el) => el.classList.add('leaving'))
        setTimeout(paint, 220)
      }

      /* ---- board writes: quick-add composer --------------------------------- */
      /* The composer's text lives here, not in the DOM: the board repaints from
         polls every few seconds, and inputs that only existed in the DOM would
         lose a half-typed title to the next one. Every keystroke writes through
         to `draft`, so a repaint rebuilds the same words — and while the
         composer is open polls don't repaint at all (see drawBoard), so focus
         survives too. */
      let composerOpen = false
      let composerSaving = false
      let composerError = ''
      let draft = {title: '', description: '', labels: '', priority: 2}

      /* Lanes a card can be dropped on. Staging and the work tree report
         derived state — unpushed commits, the raw working copy — so there is
         nothing to drop onto; everything else is a real place a bead can be.
         Backlog's zone is the strip's own data-drop below rather than a lane
         card, and the server's MOVE_LANES is the third copy — a lane added in
         one place needs adding in all three. */
      const DROP_LANES = new Set(['ready', 'blocked', 'in_progress', 'review', 'done', 'backlog'])

      function composerHtml() {
        const segs = [0, 1, 2, 3, 4]
          .map(
            (p) =>
              `<button type="button" role="radio" data-prio="${p}" aria-checked="${draft.priority === p}"
                tabindex="${draft.priority === p ? '0' : '-1'}" title="P${p}">P${p}</button>`,
          )
          .join('')
        return `
          <div class="composer" id="composer">
            <input id="composerTitle" type="text" placeholder="bead title…" value="${esc(draft.title)}"
              maxlength="300" aria-label="Title" ${composerSaving ? 'disabled' : ''} />
            <textarea id="composerDesc" placeholder="description (optional)" aria-label="Description"
              ${composerSaving ? 'disabled' : ''}>${esc(draft.description)}</textarea>
            <div class="composer-row">
              <div class="labels-wrap">
                <input id="composerLabels" type="text" placeholder="labels, comma-separated" value="${esc(draft.labels)}"
                  aria-label="Labels" autocomplete="off" role="combobox" aria-autocomplete="list"
                  aria-expanded="false" aria-controls="composerSuggest"
                  ${composerSaving ? 'disabled' : ''} />
                <div class="suggest" id="composerSuggest" role="listbox" aria-label="Label suggestions" hidden></div>
              </div>
              <div class="seg" role="radiogroup" aria-label="Priority">${segs}</div>
            </div>
            <div class="composer-row actions">
              <span class="form-error">${esc(composerError)}</span>
              <button class="mini" type="button" data-composer-cancel ${composerSaving ? 'disabled' : ''}>cancel</button>
              <button class="mini" type="button" data-composer-save ${composerSaving ? 'disabled' : ''}>
                ${composerSaving ? 'saving…' : 'save'}</button>
            </div>
          </div>`
      }

      /* What the label field suggests. The server sends every label in the
         ledger, so a ledger whose labels all sit on closed beads still
         suggests them; the fallback derives them for a server from before. */
      function allLabels() {
        if (lastLedger?.ledger?.all_labels?.length) return lastLedger.ledger.all_labels
        const seen = new Set()
        for (const i of lastLedger?.ledger?.issues || []) for (const l of i.labels || []) seen.add(l)
        return [...seen].sort()
      }

      /* Which suggestion the keyboard has armed. Focus never leaves the label
      field — the input's aria-activedescendant names the armed option, and
      Enter picks it. -1 is nothing armed: arrows from there land on an end. */
      let suggestActive = -1

      function renderSuggestions(input) {
        const box = $('composerSuggest')
        if (!input || !box) return
        const parts = input.value.split(',')
        const token = (parts.pop() || '').trim().toLowerCase()
        const used = new Set(parts.map((s) => s.trim().toLowerCase()).filter(Boolean))
        const matches = allLabels()
          .filter((l) => !used.has(l.toLowerCase()) && (!token || l.toLowerCase().includes(token)))
          .slice(0, 8)
        // A fresh list arms nothing — the reader's next arrow says where to go.
        suggestActive = -1
        if (!matches.length) {
          box.hidden = true
          box.innerHTML = ''
          input.setAttribute('aria-expanded', 'false')
          input.removeAttribute('aria-activedescendant')
          return
        }
        box.innerHTML = matches
          .map(
            (m, ix) =>
              `<div role="option" id="composerSuggest-${ix}" aria-selected="false" data-suggest="${esc(m)}">${esc(m)}</div>`,
          )
          .join('')
        box.hidden = false
        input.setAttribute('aria-expanded', 'true')
        input.removeAttribute('aria-activedescendant')
      }

      /* The armed option, repainted in place — a re-render here would cost
      nothing visually, but rebuilding the list under the reader's arrows is
      how focus gets lost mid-gesture. */
      function markSuggestionActive(input) {
        const box = $('composerSuggest')
        if (!input || !box) return
        const opts = [...box.querySelectorAll('[role="option"]')]
        opts.forEach((o, ix) => o.setAttribute('aria-selected', String(ix === suggestActive)))
        const armed = opts[suggestActive]
        if (armed) {
          input.setAttribute('aria-activedescendant', armed.id)
          armed.scrollIntoView({block: 'nearest'})
        } else {
          input.removeAttribute('aria-activedescendant')
        }
      }

      /* The typed fragment is the last segment; a pick replaces it and the
      field keeps the comma-separated shape it already had. Shared by the
      pointer press and the keyboard's Enter, so both land in the same place. */
      function pickSuggestion(value) {
        const input = $('composerLabels')
        if (!input) return
        const kept = input.value
          .split(',')
          .slice(0, -1)
          .map((s) => s.trim())
          .filter(Boolean)
        kept.push(value)
        input.value = kept.join(', ')
        draft.labels = input.value
        renderSuggestions(input)
        input.focus()
      }

      function hideSuggestions() {
        suggestActive = -1
        const box = $('composerSuggest')
        if (box) {
          box.hidden = true
          box.innerHTML = ''
        }
        const input = $('composerLabels')
        if (input) {
          input.setAttribute('aria-expanded', 'false')
          input.removeAttribute('aria-activedescendant')
        }
      }

      /* One press picks the priority, and the pressed segment fills like
      .mini's. Roving tabindex: the checked segment is the group's one tab
      stop, and arrows move both the check and the focus together. */
      function setPriority(p, focus = false) {
        draft.priority = p
        const btns = [...document.querySelectorAll('#composer .seg [data-prio]')]
        btns.forEach((b) => {
          const on = +b.dataset.prio === p
          b.setAttribute('aria-checked', String(on))
          b.tabIndex = on ? 0 : -1
          if (on && focus) b.focus()
        })
      }

      function openComposer() {
        composerOpen = true
        composerError = ''
        // The composer renders at the top of ready's cards, which a folded
        // lane would hide — opening it unfolds the lane it lives in.
        foldedLanes.delete('ready')
        paintNow()
        requestAnimationFrame(() => $('composerTitle')?.focus())
      }

      function cancelComposer() {
        composerOpen = false
        composerSaving = false
        composerError = ''
        draft = {title: '', description: '', labels: '', priority: 2}
        paintNow()
      }

      async function saveComposer() {
        const title = draft.title.trim()
        const errEl = document.querySelector('#composer .form-error')
        if (!title) {
          if (errEl) errEl.textContent = 'a bead needs a title'
          $('composerTitle')?.focus()
          return
        }
        composerSaving = true
        if (errEl) errEl.textContent = ''
        const btn = document.querySelector('[data-composer-save]')
        if (btn) btn.disabled = true
        const labels = draft.labels
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean)
        try {
          const r = await (
            await fetch('beads/create', {
              method: 'POST',
              body: JSON.stringify({title, description: draft.description.trim(), labels, priority: draft.priority}),
            })
          ).json()
          if (r.ok) {
            cancelComposer()
            tick()
          } else {
            composerSaving = false
            if (errEl) errEl.textContent = r.error || 'create failed'
            if (btn) btn.disabled = false
          }
        } catch {
          composerSaving = false
          if (errEl) errEl.textContent = "nothing is serving this page, so the bead wasn't filed"
          if (btn) btn.disabled = false
        }
      }

      /* A failed write says so and leaves. The board snaps back to the
         server's state on the next poll; the toast is the only trace. */
      let toastTimer = 0
      function toast(msg) {
        const t = $('toast')
        if (!t) return
        t.textContent = msg
        t.hidden = false
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => (t.hidden = true), 4500)
      }

      /* ---- board writes: drag-and-drop ------------------------------------ */
      /* Native HTML5 drag, not a library: five lanes, one gesture, no touch
         story needed for a page that lives in a desktop browser pane. The
         lanes don't repaint mid-drag (see drawBoard), so the drop zone can't
         move under the pointer. */
      let draggedId = null
      let draggedNode = null
      // A timestamp, not a flag: the click that ends a drag must be ignored,
      // and only just after the drag — compared against Date.now(), below.
      let lastDragEnd = 0
      /* A press that begins on a caret is an expansion, not the start of a
      move — but dragstart fires on the draggable card, and `closest` only
      walks up, so the handler can't see the caret from there. The mousedown
      below remembers where the press began; dragstart reads that instead. A
      suppressed press that still travels counts as a drag attempt, and the
      click ending it is swallowed rather than toggling. */
      let caretDown = null
      let caretSwallowed = false

      function clearDropState() {
        document.querySelectorAll('.dragging').forEach((el) => el.classList.remove('dragging'))
        document.querySelectorAll('.drop-hint').forEach((el) => el.classList.remove('drop-hint'))
      }

      function dragSourceLane(id) {
        // The node the drag started from, not the first match in the document:
        // a bead shown twice (a backlog child under its expanded board parent)
        // must report the lane it was actually picked up from. Falls back to
        // the lookup for presses that never passed through dragstart.
        const card =
          draggedNode && draggedNode.dataset.bead === id
            ? draggedNode
            : [...document.querySelectorAll('.card')].find((c) => c.dataset.bead === id)
        if (!card) return ''
        return card.closest('[data-lane]')?.dataset.lane || (card.closest('#backlogStrip') ? 'backlog' : '')
      }

      document.addEventListener('mousedown', (e) => {
        caretDown = e.target.closest?.('[data-expand]')
          ? {x: e.clientX, y: e.clientY}
          : null
        caretSwallowed = false
      })
      document.addEventListener('mousemove', (e) => {
        if (caretDown && Math.hypot(e.clientX - caretDown.x, e.clientY - caretDown.y) > 6) {
          caretSwallowed = true
        }
      })
      document.addEventListener('mouseup', () => (caretDown = null))

      document.addEventListener('dragstart', (e) => {
        // The press began on the caret (see caretDown above) — suppress the
        // move the card would otherwise start under it.
        if (caretDown) return e.preventDefault()
        const card = e.target.closest?.('.card[data-bead]')
        if (!card) return
        draggedId = card.dataset.bead
        draggedNode = card
        e.dataTransfer.setData('text/plain', draggedId)
        e.dataTransfer.effectAllowed = 'move'
        card.classList.add('dragging')
      })
      document.addEventListener('dragend', () => {
        if (!draggedId) return
        draggedId = null
        draggedNode = null
        clearDropState()
        lastDragEnd = Date.now()
        // A poll may have arrived mid-drag and been held; repaint now that
        // the pointer is gone so nothing stays stale.
        paintNow()
      })
      document.addEventListener('dragover', (e) => {
        const zone = e.target.closest?.('[data-drop]')
        if (!zone || !draggedId) return
        e.preventDefault()
        e.dataTransfer.dropEffect = 'move'
        zone.classList.add('drop-hint')
      })
      document.addEventListener('dragleave', (e) => {
        const zone = e.target.closest?.('[data-drop]')
        if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop-hint')
      })
      document.addEventListener('drop', (e) => {
        const zone = e.target.closest?.('[data-drop]')
        if (!zone || !draggedId) return
        e.preventDefault()
        const id = draggedId
        const to = zone.dataset.drop
        // Read before clearing: dragSourceLane prefers the node the drag
        // started from, and it is gone below.
        const from = dragSourceLane(id)
        draggedId = null
        draggedNode = null
        clearDropState()
        // dragend fires next and would repaint twice; claiming the gesture
        // here makes it a no-op there.
        lastDragEnd = Date.now()
        if (!to || from === to) return paintNow()
        postMove(id, to)
          .then((r) => {
            if (!r.ok) toast(r.error || 'move failed')
            tick()
          })
          .catch(() => toast("nothing is serving this page, so the move didn't go through"))
      })

      function laneCard(l) {
        const limit = laneLimits[l.key] ?? LANE_PAGE
        const shown = l.items.slice(0, limit)
        const rest = l.items.length - shown.length
        const droppable = DROP_LANES.has(l.key)
        return `
          <details class="panel lane ${l.key}" data-lane="${esc(l.key)}" ${droppable ? `data-drop="${esc(l.key)}"` : ''} ${foldedLanes.has(l.key) ? '' : 'open'}>
            <summary>
              <span class="chev">›</span>
              <h2 class="lane-name ${l.hover ? 'hoverable' : ''}"
                  ${l.hover ? 'tabindex="0" role="note" aria-label="Stage detail"' : ''}>
                ${esc(l.label)}
                ${l.hover ? `<span class="tip" id="${l.hover}"></span>` : ''}
              </h2>
              ${l.slot ? runSlot(l.slot) : ''}
              ${
                l.key === 'ready'
                  ? `<button class="add-bead" type="button" data-add-bead title="File a bead"
                      aria-label="File a bead" aria-expanded="${composerOpen}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`
                  : ''
              }
              ${l.count !== undefined ? `<span class="n">${l.count}</span>` : ''}
            </summary>
            <div class="lane-cards">
              ${l.key === 'ready' && composerOpen ? composerHtml() : ''}
              ${
                l.key === 'ready' && !l.items.length && !composerOpen
                  ? `<p class="lane-note">nothing ready — press + to file the next thing.</p>`
                  : ''
              }
              ${l.note ? `<p class="lane-note">${esc(l.note)}</p>` : ''}
              ${renderTree(shown, l.key)}
              ${
                rest > 0
                  ? `<button class="load-more" data-more="${esc(l.key)}">
                  load ${Math.min(rest, LANE_PAGE)} more</button>`
                  : ''
              }
            </div>
          </details>`
      }

      /* ---- backlog ---------------------------------------------------------- */
      /* Filed, not offered. It sits above the board because it's the shelf the board
         draws from, and collapsed because nothing here is the next thing to do. */
      function drawBacklog(d, force = false) {
        // No ledger, no shelf: the strip hides rather than drawing an empty one —
        // and a section the project hid never draws, even with beads on it.
        if (!d.ledger || d.ledger.available === false || boardConfig(d).hidden.has('backlog')) {
          $('backlog').hidden = true
          backlogSignature = ''
          return
        }
        const items = d.ledger.issues
          .filter((i) => i.backlog)
          // bd returns no meaningful order, so the strip reads down by priority —
          // otherwise "first" would change between polls.
          .sort((a, b) => a.priority - b.priority || String(a.created_at).localeCompare(String(b.created_at)))
        // Held like the board while a composer is open or a drag is in flight:
        // the strip is a drop zone, and rebuilding it mid-drag destroys the
        // source node out from under the gesture.
        if (!force && (composerOpen || draggedId)) return
        const inBacklog = new Set(items.map((i) => i.id))
        const markup = renderTree(items.filter((i) => !beadParents(i).some((id) => inBacklog.has(id))), 'backlog')
        // Fingerprint the rows themselves: reparenting, blocker changes and
        // expansion all repaint even when the shelved ids stay the same.
        const signature = JSON.stringify([items.length, markup])
        if (signature === backlogSignature) return
        backlogSignature = signature

        $('backlog').hidden = !items.length
        $('backlogCount').textContent = items.length
        $('backlogStrip').innerHTML = markup
      }

      /* ---- work tree ---------------------------------------------------------- */
      /* Every path git status has an opinion about — the raw working copy, not the
         beads it might carry. Staged rows first, then unstaged, alphabetical within
         each: the same order `git status` reads in, which is the order a commit
         right now would actually take. */
      const UNDO_ICON = `<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8h7a5 5 0 1 1 0 10h-2" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 4.5 4 8l3.5 3.5" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`

      let worktree = {byPath: {}}

      // The directory is context; the filename is the thing being identified —
      // splitting them lets one read as secondary and the other as primary,
      // rather than one long string of one weight.
      function splitPath(path) {
        const i = path.lastIndexOf('/')
        return i === -1 ? {dir: '', base: path} : {dir: path.slice(0, i + 1), base: path.slice(i + 1)}
      }

      /* The work-tree row is two components, not one div shape: the identity
         (checkbox, status letter, coloured name) and the undo button. The list
         row and the diff sheet's header both compose them, each into whatever
         shell actually fits its context, rather than the header borrowing the
         row's own div and fighting its CSS. `clickable` is the one thing that
         differs between them — the header's name opens a menu, the row's doesn't. */
      function wtIdentity(e, {clickable = false} = {}) {
        const {dir, base} = splitPath(e.path)
        const label = `<span class="wt-base">${esc(base)}</span><span class="wt-dir">${esc(dir)}</span>`
        const name = clickable
          ? `<button class="wt-filename" id="sheetTitle" data-filemenu="${esc(e.path)}">${label}</button>`
          : `<span class="wt-name">${label}</span>`
        const cls = esc((e.untracked ? 'n' : e.status).toLowerCase())
        return `<input class="wt-checkbox" type="checkbox" data-stage="${esc(e.path)}"
              aria-label="Stage ${esc(e.path)}" ${e.staged ? 'checked' : ''} />
            <span class="wt-status wt-${cls}">${esc(e.untracked ? 'N' : e.status)}</span>
            ${name}`
      }

      function wtRevertButton(e) {
        return `<button class="wt-revert" data-revert="${esc(e.path)}" aria-label="Revert ${esc(e.path)}"
            title="Revert">${UNDO_ICON}</button>`
      }

      function wtRow(e) {
        return `<div class="wt-row" data-diff="${esc(e.path)}" tabindex="0" role="button"
              aria-label="View diff for ${esc(e.path)}">
          ${wtIdentity(e)}
          ${wtRevertButton(e)}
        </div>`
      }

      /* Same lane shell as a bead lane (panel/details/summary/lane-cards), so it
         gets the board's spacing, fold state, and enter/leave animation for free
         — it's rendered by `drawBoard` alongside the bead lanes rather than
         standing outside the board as its own panel. Unlike a bead lane, it
         never paginates behind `laneCard`'s load-more: the working tree is
         everything a commit right now would take, and hiding some of it behind
         a click is the one place that's actively the wrong default. */
      function worktreeLane(d) {
        const items = d.worktree || []
        return `
          <details class="panel lane worktree" data-lane="worktree" ${foldedLanes.has('worktree') ? '' : 'open'}>
            <summary>
              <span class="chev">›</span>
              <h2>work tree</h2>
              <button class="mini" type="button" data-commit-toggle
                  aria-expanded="${commitComposeOpen}" aria-controls="commitPop">commit</button>
              <span class="n">${items.length}</span>
            </summary>
            <div class="lane-cards">${items.map(wtRow).join('')}</div>
          </details>`
      }

      /* ---- markdown ---------------------------------------------------------- */
      /* marked, vendored beside this page — no CDN, no build step, no node_modules.
         A hand-rolled parser handled the simple cases and then met a numbered list
         whose items hold several paragraphs, which is most of these documents: it
         closed the list at the first blank line and restarted the count, so a
         seven-step loop rendered as step one, then steps one through six again.
         Getting that right is block-level nesting, which is the whole job. */

      /* marked passes raw HTML in the source straight through. These files are local
         and the user's own, but they're also written by an agent summarising things
         it read elsewhere, so what reaches innerHTML is rebuilt from an allowlist
         rather than trusted. An unknown element gives up its tags and keeps its text. */
      const MD_TAGS = new Set([
        'P',
        'BR',
        'HR',
        'EM',
        'STRONG',
        'DEL',
        'CODE',
        'PRE',
        'A',
        'UL',
        'OL',
        'LI',
        'BLOCKQUOTE',
        'H1',
        'H2',
        'H3',
        'H4',
        'H5',
        'H6',
        'TABLE',
        'THEAD',
        'TBODY',
        'TR',
        'TH',
        'TD',
      ])

      function sanitize(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html')
        for (const el of doc.body.querySelectorAll('*')) {
          if (!MD_TAGS.has(el.tagName)) {
            el.replaceWith(...el.childNodes)
            continue
          }
          for (const attr of [...el.attributes]) {
            // href only, and only somewhere a browser can actually go. A relative
            // link is a path on this machine: it keeps its text and loses the link
            // rather than navigating the dashboard to a 404.
            if (!(attr.name === 'href' && /^https?:\/\//i.test(attr.value))) {
              el.removeAttribute(attr.name)
            }
          }
          if (el.tagName !== 'A') continue
          if (el.getAttribute('href')) {
            el.target = '_blank'
            el.rel = 'noreferrer'
          } else el.replaceWith(...el.childNodes)
        }
        return doc.body.innerHTML
      }

      function markdown(src) {
        // Frontmatter is the file's own bookkeeping rather than prose in it: shown
        // plainly, and kept away from the parser where its `---` reads as a rule.
        let head = ''
        const front = src.match(/^---\n([\s\S]*?)\n---\n/)
        if (front) {
          head = `<pre class="front">${esc(front[1])}</pre>`
          src = src.slice(front[0].length)
        }
        // The page owns h1 and h2, so a document's headings start below them instead
        // of competing with the panel titles. An <h1> written inside a code block
        // arrives escaped as &lt;h1&gt; and is left alone by this.
        const shifted = marked
          .parse(src)
          .replace(/<(\/?)h([1-4])\b/g, (_, close, n) => `<${close}h${Math.min(+n + 2, 6)}`)
        return head + sanitize(shifted)
      }

      /* ---- the harness ------------------------------------------------------- */
      /* The system that produced everything above it, in the order a session meets
         it. Collapsed by default: this is the machinery, not the work. */
      let harnessSignature = ''
      let harness = {byId: {}}

      function drawHarness(d) {
        const stages = d.harness || []
        // No .claude/ on disk means no stages with anything in them, and a
        // panel of "nothing here" rows is a confused shape — the whole panel
        // hides instead, as it does when the project hid the section. Set
        // before the signature check so a return to nothing still lands.
        const nodes = stages.flatMap((s) => s.nodes)
        $('harness').hidden = nodes.length === 0 || boardConfig(d).hidden.has('harness')
        if (!nodes.length) return
        const signature = JSON.stringify(stages)
        if (signature === harnessSignature) return
        harnessSignature = signature

        harness.byId = Object.fromEntries(nodes.map((n) => [n.id, n]))
        const count = Object.keys(harness.byId).length
        const mine = Object.values(harness.byId).filter((n) => n.origin === 'claude').length
        $('harnessCount').textContent = `${count} pieces`

        $('harnessFlow').innerHTML =
          `
          <div class="legend">
            <span><i style="background:var(--accent)"></i>${mine} from claude code</span>
            <span><i style="background:var(--dim)"></i>${count - mine} built on top</span>
          </div>` +
          stages
            .map(
              (s) => `
          <div class="stage">
            <div class="stage-head"><b>${esc(s.name)}</b><span>${esc(s.blurb)}</span></div>
            <div class="nodes">${
              s.nodes
                .map(
                  (n) =>
                    `<button class="node ${n.origin}" data-node="${esc(n.id)}" title="${esc(n.path)}">
                 <i></i>${esc(n.name)}<span class="t">${n.tokens}</span>
               </button>`,
                )
                .join('') || '<div class="empty">nothing here</div>'
            }</div>
          </div>`,
            )
            .join('')
      }

      /* ---- the detail sheet -------------------------------------------------- */
      /* One sheet, and a source per kind of thing it can be pointed at. The sheet
         knows how to open, stay current, and close; each source knows how to find its
         subject and draw it, and may hydrate it with anything too expensive to poll. */
      const SHEET = {
        bead: {find: (id) => ledger.byId[id], draw: beadSheet},
        node: {find: (id) => harness.byId[id], draw: nodeSheet, hydrate: readFile},
        diff: {find: (path) => worktree.byPath[path], draw: diffSheet, hydrate: hydrateDiff},
      }
      // The one sheet that needs the room: a unified diff read line by line is
      // fine in a reading column, but side-by-side is the point of vendoring a
      // diff renderer at all, and that needs width the prose sheet doesn't.
      const WIDE_SHEET = new Set(['diff'])
      let subject = null

      /* The lanes a sheet can file its bead into. Staging reports derived
      state rather than holding beads, so it lends its label here to done —
      the one place a bead can actually be. Kept in step with DROP_LANES and
      the server's MOVE_LANES: a lane added in one place needs adding in all
      three. */
      const MOVE_TARGETS = [
        ...BEAD_LANES.filter(([k]) => k !== 'staging'),
        ['done', 'done'],
        ['backlog', 'backlog'],
      ]

      /* Where the sheet's bead stands, so its own button can read
      aria-disabled — focusable, unlike disabled, so keyboard users still find
      it. Backlog isn't a laneOf — it's a flag on the bead — and staging isn't
      a place a bead can be moved to, so both fold onto the move targets. */
      function beadLane(i) {
        if (i.backlog) return 'backlog'
        const raw = ledger.laneOf ? ledger.laneOf(i) : i.status
        return raw === 'staging' ? 'done' : raw
      }

      /* One POST both move paths share — the drop handler and the sheet's
      buttons differ only in what follows it (see call sites for tick). */
      async function postMove(id, lane) {
        return (
          await fetch('beads/move', {method: 'POST', body: JSON.stringify({id, lane})})
        ).json()
      }

      /* The sheet's unsent edit, beside the composer's draft for the same
      reason: the sheet is rebuilt from innerHTML on every poll, so the typed
      title, the pressed segment, and the typed close reason all have to
      survive a repaint. Every keystroke writes through to here (see the input
      listener below), so a repaint rebuilds the same words — and while an
      edit is armed polls don't repaint the sheet at all (see drawSheet).
      Cleared on save and whenever the sheet moves. */
      const pendingEdit = {id: null, prio: null, title: null, reason: null}

      function clearPendingEdit() {
        pendingEdit.id = null
        pendingEdit.prio = null
        pendingEdit.title = null
        pendingEdit.reason = null
      }

      function setEditPrio(btn) {
        const id = subject && subject.kind === 'bead' ? subject.id : null
        const incoming = +btn.dataset.editPrio
        // Clicking the already-selected segment (or Home on it) changes
        // nothing: arming here would hold repaints forever on values identical
        // to the ledger, so compare against the ledger first and leave the
        // sheet unarmed when both the prio and the live title match.
        const bead = id ? ledger.byId[id] : null
        // Arming a hold on a bead saveEdit can never save is dead state.
        if (!bead) return
        const titleEl = $('editTitle')
        const liveTitle = titleEl ? titleEl.value : null
        if (bead && incoming === bead.priority && (liveTitle === null || liveTitle === bead.title)) return
        pendingEdit.id = id
        // Focus is on the pressed segment now, so the typing guard in
        // drawSheet no longer holds — the title is captured here before the
        // control is marked, or the next poll would rebuild it from the
        // ledger and drop the draft.
        pendingEdit.title = liveTitle
        pendingEdit.prio = incoming
        const btns = [...document.querySelectorAll('#sheetBody .seg [data-edit-prio]')]
        btns.forEach((b) => {
          const on = +b.dataset.editPrio === pendingEdit.prio
          b.setAttribute('aria-checked', String(on))
          b.tabIndex = on ? 0 : -1
        })
      }

      /* Retitle / reprioritise from the sheet. Only changed fields travel —
      the server rejects an empty update, and the sheet says "no changes"
      before it ever asks. */
      async function saveEdit(id, btn) {
        const i = ledger.byId[id]
        // A bead that left the ledger (deleted elsewhere) while its sheet
        // stood open: say so like saveClose does, and drop the armed draft.
        if (!i) { if ($('editError')) $('editError').textContent = "the board isn't showing that bead"; clearPendingEdit(); return }
        const titleEl = $('editTitle')
        const errEl = $('editError')
        let title = titleEl ? titleEl.value : ''
        if (pendingEdit.id === id && pendingEdit.title !== null) title = pendingEdit.title
        title = title.trim()
        const prio = pendingEdit.id === id && pendingEdit.prio !== null ? pendingEdit.prio : i.priority
        if (!title) {
          if (errEl) errEl.textContent = 'a bead needs a title'
          titleEl?.focus()
          return
        }
        if (title === i.title && prio === i.priority) {
          if (errEl) errEl.textContent = 'no changes'
          clearPendingEdit()
          return
        }
        btn.disabled = true
        if (errEl) errEl.textContent = ''
        try {
          const body = {id}
          if (title !== i.title) body.title = title
          if (prio !== i.priority) body.priority = prio
          const r = await (await fetch('beads/update', {method: 'POST', body: JSON.stringify(body)})).json()
          if (r.ok) {
            clearPendingEdit()
            tick()
          } else {
            if (errEl) errEl.textContent = r.error || 'update failed'
            btn.disabled = false
          }
        } catch {
          if (errEl) errEl.textContent = "nothing is serving this page, so the edit didn't go through"
          btn.disabled = false
        }
      }

      /* Close from the sheet, carrying the reason the ledger keeps. The drop
      on done stays wordless; this is where the words go. */
      async function saveClose(id, btn) {
        const errEl = $('closeError')
        btn.disabled = true
        if (errEl) errEl.textContent = ''
        try {
          // The typed reason writes through to pendingEdit on every keystroke
          // (see the input listener below), so prefer it over the DOM: a poll
          // that repainted the sheet rebuilt the input from here, and reading
          // the DOM would lose the words to a changed signature mid-type.
          let reason = $('closeReason') ? $('closeReason').value : ''
          if (pendingEdit.id === id && pendingEdit.reason !== null) reason = pendingEdit.reason
          reason = reason.trim()
          const r = await (
            await fetch('beads/close', {method: 'POST', body: JSON.stringify({id, reason})})
          ).json()
          if (r.ok) {
            clearPendingEdit()
            tick()
          } else {
            if (errEl) errEl.textContent = r.error || 'close failed'
            btn.disabled = false
          }
        } catch {
          if (errEl) errEl.textContent = "nothing is serving this page, so the close didn't go through"
          btn.disabled = false
        }
      }

      /* The keyboard path for lane moves: drag-and-drop stays as the pointer
      gesture, and these buttons POST the same move the drop handler does. The
      button arrives disabled in flight and is replaced on success (the sheet
      repaints from the fresh ledger below); on failure it is re-enabled so
      retry survives without reopening the sheet. */
      async function moveBead(id, lane, btn) {
        try {
          const r = await postMove(id, lane)
          if (!r.ok) {
            toast(r.error || 'move failed')
            if (btn) btn.disabled = false
          } else {
            await tick()
            // A typed draft arms pendingEdit, which holds sheet repaints —
            // without this the success repaint never comes and the pressed
            // button stays dead on the old lane. beadSheet rebuilds from
            // pendingEdit, so forcing the repaint keeps the draft while the
            // move row answers from the fresh ledger.
            refreshSheet(true)
          }
        } catch {
          toast("nothing is serving this page, so the move didn't go through")
          if (btn) btn.disabled = false
        }
      }

      function beadSheet(i) {
        const kids = (i.children || []).map((id) => ledger.byId[id]).filter(Boolean)
        const commits = i.commits || []
        const block = (label, text) => (text ? `<section><h4>${esc(label)}</h4><p>${esc(text)}</p></section>` : '')
        const here = beadLane(i)
        const moveRow = `<section><h4>move to</h4><div class="move-row" role="group" aria-label="Move to">${MOVE_TARGETS.map(
          ([key, label]) =>
            `<button class="mini" type="button" data-move="${esc(key)}" data-bead-id="${esc(i.id)}"${
              key === here ? ' aria-disabled="true" title="Already here"' : ''
            }>${esc(label)}</button>`,
        ).join('')}</div></section>`
        // The unsent edit lives here rather than in the DOM: a poll that
        // repaints the sheet would otherwise disarm the segment and wipe the
        // title, the same way a board repaint would eat the composer's draft.
        const prio = pendingEdit.id === i.id && pendingEdit.prio !== null ? pendingEdit.prio : i.priority
        const editTitle = pendingEdit.id === i.id && pendingEdit.title !== null ? pendingEdit.title : i.title
        const editRow = `<section><h4>edit</h4>
          <div class="edit-row">
            <input type="text" id="editTitle" value="${esc(editTitle)}" maxlength="300" aria-label="Title" />
            <div class="seg" role="radiogroup" aria-label="Priority">${[0, 1, 2, 3, 4]
              .map(
                (p) =>
                  `<button type="button" role="radio" data-edit-prio="${p}" aria-checked="${prio === p}" tabindex="${prio === p ? '0' : '-1'}" title="P${p}">P${p}</button>`,
              )
              .join('')}</div>
          </div>
          <div class="composer-row actions">
            <span class="form-error" id="editError"></span>
            <button class="mini" type="button" data-edit-save data-bead-id="${esc(i.id)}">save</button>
          </div></section>`
        const closeRow =
          i.status === 'closed'
            ? ''
            : `<section><h4>close</h4>
          <div class="edit-row">
            <input type="text" id="closeReason" placeholder="why it's done…" maxlength="600" aria-label="Close reason" value="${esc(pendingEdit.id === i.id && pendingEdit.reason !== null ? pendingEdit.reason : '')}" />
          </div>
          <div class="composer-row actions">
            <span class="form-error" id="closeError"></span>
            <button class="mini" type="button" data-close-save data-bead-id="${esc(i.id)}">close</button>
          </div></section>`

        return `
          <h3 class="title" id="sheetTitle">${esc(i.title)}</h3>
          <div class="meta">
            <code>${esc(i.id)}</code>
            <span class="chip">P${i.priority}</span>
            ${i.type !== 'task' ? `<span class="chip">${esc(i.type)}</span>` : ''}
            <span class="chip ${i.status === 'closed' ? 'ok' : ''}">${esc(i.status.replace('_', ' '))}</span>
            ${(i.labels || []).map((l) => `<span class="chip epic">${esc(l)}</span>`).join('')}
            ${i.owner ? `<code>@${esc(i.owner)}</code>` : ''}
          </div>
          ${moveRow}
          ${editRow}
          ${closeRow}
          ${block('description', i.description)}
          ${block('design', i.design)}
          ${block('notes', i.notes)}
          ${block('why it closed', i.close_reason)}
          ${
            kids.length
              ? `<section><h4>sub-beads</h4><div class="kids">${kids
                  .map(
                    (k) =>
                      `<button class="kid ${k.status === 'closed' ? 'closed' : ''}" data-bead="${esc(k.id)}">
               <span class="tick">${k.status === 'closed' ? '✓' : '○'}</span>
               <span>${esc(k.title)}</span>
             </button>`,
                  )
                  .join('')}</div></section>`
              : ''
          }
          ${
            commits.length
              ? `<section><h4>waiting to push</h4>${commits
                  .map(
                    (c) =>
                      `<div class="commit-row"><code>${esc(c.sha)}</code>
               <span>${esc(c.subject)}</span></div>`,
                  )
                  .join('')}</section>`
              : ''
          }`
      }

      /* A harness node's file is tens of thousands of characters and nobody reads it
         until they open it, so it never rides the poll — the sheet asks for one file
         and keeps it. `{text}` on success, `{error}` when there's nothing serving. */
      const fileText = {}
      const reading = new Set()

      async function readFile(id) {
        if (id in fileText || reading.has(id)) return
        reading.add(id)
        try {
          const r = await fetch('harness/' + encodeURIComponent(id))
          fileText[id] = r.ok ? {text: (await r.json()).body} : {error: 'The server has no file under that name.'}
        } catch {
          fileText[id] = {error: "Nothing is serving this page, so its contents can't be read."}
        }
        reading.delete(id)
        refreshSheet()
      }

      function nodeSheet(n) {
        const got = fileText[n.id]
        return `
          <h3 class="title" id="sheetTitle">${esc(n.name)}</h3>
          <div class="meta">
            <code>${esc(n.path)}</code>
            <span class="chip">${esc(n.origin === 'claude' ? 'claude code' : n.origin)}</span>
            <span class="chip epic">${n.tokens} tokens</span>
          </div>
          <section><h4>role</h4><p>${esc(n.role)}</p></section>
          <section><h4>contents</h4>${
            !got
              ? `<div class="note">reading…</div>`
              : got.error
                ? `<div class="note">${esc(got.error)}</div>`
                : // Prose gets rendered; a script or a ledger export is code, and code is
                  // only readable as the characters that were actually written.
                  /\.md$/i.test(n.path)
                  ? `<div class="md">${markdown(got.text)}</div>`
                  : `<pre class="file">${esc(got.text)}</pre>`
          }</section>`
      }

      /* A diff never rides the poll either — it's the unified text for one path,
         fetched fresh each time the sheet opens on it. Keyed rather than a single
         slot, so toggling a file's checkbox and reopening it doesn't show a stale
         diff for a second while the fresh one is in flight. */
      const diffCache = {}
      const diffReading = new Set()

      async function hydrateDiff(path) {
        if (diffReading.has(path)) return
        diffReading.add(path)
        try {
          const r = await fetch('diff?path=' + encodeURIComponent(path))
          diffCache[path] = r.ok ? await r.json() : {error: 'Could not load the diff.'}
        } catch {
          diffCache[path] = {error: "Nothing is serving this page, so the diff can't be read."}
        }
        diffReading.delete(path)
        refreshSheet()
      }

      /* Which grammar a path gets. Only the languages this repo actually holds —
         an extension that isn't here renders plain, which is the honest outcome
         for a file highlight.js would guess wrong about anyway. */
      const DIFF_LANGUAGE = {
        swift: 'swift',
        py: 'python',
        sh: 'bash',
        bash: 'bash',
        js: 'javascript',
        json: 'json',
        html: 'xml',
        css: 'css',
        md: 'markdown',
        yml: 'yaml',
        yaml: 'yaml',
      }

      /* diff2html's core bundle renders the table; the UI bundle that would call
         highlight.js is a separate script and does no more than this. A line at a
         time, because that's the cell the side-by-side table lays out — a string
         or comment spanning lines loses its colour at the break.
         Text nodes rather than the cell's innerHTML, because a modified line
         already holds diff2html's word-level <ins>/<del> marking which word
         changed. Overwriting the cell threw that away and left a renamed variable
         looking like an untouched line — the one thing the reader opened the diff
         for. The cost is that a token split across a mark's edge is highlighted
         as two pieces, which is the same break the line-at-a-time rule already
         accepts. */
      function highlightDiff(root, path) {
        const language = DIFF_LANGUAGE[(path.split('.').pop() || '').toLowerCase()]
        if (!language || !window.hljs || !hljs.getLanguage(language)) return
        root.querySelectorAll('.d2h-code-line-ctn').forEach((line) => {
          const walk = document.createTreeWalker(line, NodeFilter.SHOW_TEXT)
          const runs = []
          while (walk.nextNode()) runs.push(walk.currentNode)
          runs.forEach((run) => {
            if (!run.nodeValue.trim()) return
            const holder = document.createElement('span')
            holder.innerHTML = hljs.highlight(run.nodeValue, {language, ignoreIllegals: true}).value
            run.replaceWith(holder)
          })
        })
      }

      function renderDiff(text, path) {
        try {
          const holder = document.createElement('div')
          holder.innerHTML = Diff2Html.html(text, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side',
            // Follows the same prefers-color-scheme query the rest of the page
            // does, so a diff doesn't sit there in light mode inside a dark sheet.
            colorScheme: 'auto',
          })
          highlightDiff(holder, path)
          return holder.innerHTML
        } catch {
          return `<pre class="file">${esc(text)}</pre>`
        }
      }

      function diffSheet(e) {
        const got = diffCache[e.path]
        return `
          <div class="diff-header">
            ${wtIdentity(e, {clickable: true})}
            ${wtRevertButton(e)}
            <button class="diff-close" data-close-sheet aria-label="Close" title="Close">✕</button>
          </div>
          <div class="diff-body">${
            !got
              ? `<div class="note">reading…</div>`
              : got.error
                ? `<div class="note">${esc(got.error)}</div>`
                : !got.diff || !got.diff.trim()
                  ? `<div class="note">no changes.</div>`
                  : renderDiff(got.diff, e.path)
          }</div>`
      }

      /* What the sheet is currently showing. Assigning innerHTML resets the scroll
         position of everything inside it, even when the markup is identical — and a
         file long enough to scroll is exactly what this sheet holds — so the poll has
         to be able to tell "nothing changed" from "changed to the same thing". */
      let sheetHtml = ''

      function drawSheet(kind, id, force = false) {
        const found = SHEET[kind].find(id)
        if (!found) return
        // A draft in progress holds the sheet: repainting from innerHTML would
        // wipe typed text and drop focus, the same reason a poll never repaints
        // the board mid-composer. Focus in a field holds it; an armed edit
        // holds it past the press that armed it, when focus sits on a segment
        // button instead. The lookup tables are already current; the paint
        // waits for the save or the close. A forced repaint (a lane move
        // answering its own press) rebuilds from pendingEdit instead, so the
        // draft survives it — see moveBead.
        const typing =
          subject &&
          document.activeElement &&
          $('sheet').contains(document.activeElement) &&
          ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)
        const sheetDirty =
          subject &&
          subject.kind === 'bead' &&
          pendingEdit.id === subject.id &&
          (pendingEdit.title !== null || pendingEdit.prio !== null || pendingEdit.reason !== null)
        if (!force && (typing || sheetDirty)) return
        const html = SHEET[kind].draw(found)
        if (html === sheetHtml) return
        sheetHtml = html
        $('sheetBody').innerHTML = html
      }

      function openSheet(kind, id) {
        if (!SHEET[kind].find(id)) return
        subject = {kind, id}
        clearPendingEdit()
        sheetHtml = ''
        // A diff is refetched on every open — the last one is whatever the file
        // looked like the last time this path was checked, which by the time a
        // row is clicked again may not be true any more.
        if (kind === 'diff') delete diffCache[id]
        drawSheet(kind, id)
        $('sheet').classList.toggle('wide', WIDE_SHEET.has(kind))
        $('sheetBody').classList.toggle('flush', kind === 'diff')
        $('sheet').classList.add('open')
        $('scrim').classList.add('open')
        // The generic close button is hidden for a diff sheet in favour of the
        // one in its own header — that's the one to hand focus to.
        ;(kind === 'diff' ? document.querySelector('.diff-close') : $('sheetClose'))?.focus()
        SHEET[kind].hydrate?.(id)
      }

      function closeSheet() {
        subject = null
        clearPendingEdit()
        sheetHtml = ''
        $('sheet').classList.remove('open')
        $('scrim').classList.remove('open')
      }

      /* Keep an open sheet honest: the board behind it is still polling. */
      function refreshSheet(force = false) {
        if (subject) drawSheet(subject.kind, subject.id, force)
      }

      /* Wired above the polling section on purpose: the frozen artifact keeps
         everything up to that line, so its cards stay openable. Nothing here needs
         the server — the sheet reads the state the page already has. */
      /* The header panel opens on a press and stays open until dismissed — clicking
         the title, anywhere outside it, or Escape. */
      document.addEventListener('click', (e) => {
        const menu = $('titlemenu')
        if (e.target.closest('#metaToggle')) {
          const open = menu.classList.toggle('open')
          $('metaToggle').setAttribute('aria-expanded', open)
          if (open) keepInView(menu)
          return
        }
        // A click inside the panel is reading it, not dismissing it.
        if (menu.classList.contains('open') && !e.target.closest('#metaTip')) closeTitleMenu()
      })

      function closeTitleMenu() {
        $('titlemenu').classList.remove('open')
        $('metaToggle').setAttribute('aria-expanded', 'false')
      }

      /* Peer tabs switch the board in place: a press POSTs the peer's root
         to the switch endpoint (har-dy2 contract: {ok, error?}), then tick()
         repaints this same page as the new project — title, branch, board all
         change, the URL does not. The self tab is pressed and inert. */
      document.addEventListener('click', (e) => {
        const scroll = e.target.closest('[data-peer-scroll]')
        if (scroll) {
          const seg = $('peerSeg')
          seg?.scrollBy({left: Number(scroll.dataset.peerScroll) * Math.max(100, seg.clientWidth * 0.75), behavior: 'smooth'})
          return
        }
        const peer = e.target.closest('[data-peer-root]')
        if (!peer || peer.getAttribute('aria-disabled') === 'true') return
        // One switch at a time: a second press mid-flight would poll for a
        // root the server has already moved past and cry failure wrongly.
        if (startingPeerRoot) return
        switchPeer(peer)
      })

      async function switchPeer(peer) {
        const root = peer.dataset.peerRoot
        if (!root || startingPeerRoot || peer.getAttribute('aria-disabled') === 'true') return
        startingPeerRoot = root
        ++drawGen
        cancelStatePoll()
        cancelPeerPoll()
        // Busy treatment on the pressed node at once — the name stays, so the
        // row doesn't re-divide under the pointer at the moment of the press —
        // and the whole row reads inert while the switch is in flight: presses
        // elsewhere are swallowed by the single-flight guard, so no tab
        // advertises pressable. Applied to the nodes directly; a repaint here
        // would drop keyboard focus.
        peer.setAttribute('aria-busy', 'true')
        for (const b of document.querySelectorAll('.peer-seg button')) b.setAttribute('aria-disabled', 'true')
        try {
          const r = await (
            await fetch('dashboards/switch', {method: 'POST', body: JSON.stringify({root})})
          ).json()
          if (!r.ok) throw new Error(r.error || 'switch failed')
          // The server rebuilds after the switch lands; repaint only once the
          // snapshot names this root, so a half-rebuilt board never paints.
          // Generous on purpose: a cold ledger can take most of a minute, and
          // a wrong timeout here reads as a failed switch that then happens.
          const deadline = Date.now() + 60000
          for (;;) {
            let d = null
            const ctrl = new AbortController()
            const to = setTimeout(() => ctrl.abort(), 10000)
            try {
              d = await (await fetch('state.json?t=' + Date.now(), {cache: 'no-store', signal: ctrl.signal})).json()
            } catch {
              // Not rebuilt yet — keep polling until the cap.
            } finally {
              clearTimeout(to)
            }
            if (d && d.root === root) break
            if (Date.now() > deadline) throw new Error('the board did not switch in time')
            await new Promise((w) => setTimeout(w, 500))
          }
          if (startingPeerRoot === root) startingPeerRoot = ''
          await tick()
        } catch (err) {
          if (startingPeerRoot === root) startingPeerRoot = ''
          // The poll may have repainted the tab bar mid-flight, so clear by
          // state, not by node: drop the busy treatment wherever it landed and
          // let every non-current tab read pressable again. Nothing else to
          // restore — the name never left.
          for (const b of document.querySelectorAll('.peer-seg button')) {
            b.removeAttribute('aria-busy')
            if (b.getAttribute('aria-checked') !== 'true' && !b.hasAttribute('data-peer-incapable')) b.removeAttribute('aria-disabled')
          }
          toast(err instanceof SyntaxError ? 'switch failed' : err && err.message ? err.message : 'switch failed')
        }
      }

      document.addEventListener('click', (e) => {
        const more = e.target.closest('[data-more]')
        if (more) {
          const key = more.dataset.more
          laneLimits[key] = (laneLimits[key] ?? LANE_PAGE) + LANE_PAGE
          // Forced rather than redrawn: the limit carries no draft state, and
          // a held poll must not make the press look ignored. Repaints the
          // composer from `draft`, so typed words survive it — focus moves,
          // which is the honest cost of pressing something else mid-draft.
          return paintNow()
        }
        // Lives in the ready lane's summary like the commit toggle in the work
        // tree's, so a press has to stop the native fold the same way that one
        // does — otherwise filing a bead also folds the lane it files into.
        const addBead = e.target.closest('[data-add-bead]')
        if (addBead) {
          e.preventDefault()
          return composerOpen ? cancelComposer() : openComposer()
        }
        const prio = e.target.closest('[data-prio]')
        if (prio) {
          // Marked in place: a repaint here would drop the title's focus.
          setPriority(+prio.dataset.prio)
          return
        }
        const sug = e.target.closest('[data-suggest]')
        if (sug) return pickSuggestion(sug.dataset.suggest)
        if (e.target.closest('[data-composer-save]')) return saveComposer()
        if (e.target.closest('[data-composer-cancel]')) return cancelComposer()
        // The sheet's keyboard move path — the same POST a drop makes, filed
        // from a button instead of a gesture. Disabled while in flight rather
        // than silently swallowing a second press on it.
        const move = e.target.closest('[data-move]')
        if (move) {
          if (move.disabled || move.getAttribute('aria-disabled') === 'true' || !move.dataset.beadId || !move.dataset.move) return
          move.disabled = true
          return moveBead(move.dataset.beadId, move.dataset.move, move)
        }
        // The sheet's edit path — same POST discipline as the move above, from
        // an input and a segmented control instead of a button.
        const editPrio = e.target.closest('[data-edit-prio]')
        if (editPrio) return setEditPrio(editPrio)
        const editSave = e.target.closest('[data-edit-save]')
        if (editSave) {
          if (editSave.disabled || !editSave.dataset.beadId) return
          return saveEdit(editSave.dataset.beadId, editSave)
        }
        const closeSave = e.target.closest('[data-close-save]')
        if (closeSave) {
          if (closeSave.disabled || !closeSave.dataset.beadId) return
          return saveClose(closeSave.dataset.beadId, closeSave)
        }
        // The caret sits inside its card's button, so it claims its press before
        // the card-level handler below ever sees it — expanding must not also
        // open the sheet. Forced: a repaint has to answer the press at once,
        // not wait out the next poll. Focus is handed back to the rebuilt row,
        // since repainting from innerHTML drops whatever had it.
        const expander = e.target.closest('[data-expand]')
        if (expander) {
          // The click ending a drag, or a suppressed caret-drag, is the end of
          // that gesture — not a toggle.
          if (caretSwallowed) {
            caretSwallowed = false
            return
          }
          if (Date.now() - lastDragEnd < 350) return
          const id = expander.dataset.expand
          const section = cardSection(expander)
          if (expandedEpics.has(id)) expandedEpics.delete(id)
          else expandedEpics.add(id)
          paintNow()
          requestAnimationFrame(() => refocusCard(id, section))
          return
        }
        // A sub-bead in the sheet swaps the sheet's subject rather than stacking
        // another one on top — there's only ever one thing being looked at.
        const bead = e.target.closest('[data-bead]')
        if (bead) {
          // The press that ends a drag lands as a click on the card it started
          // from — opening the sheet for it would punish dropping.
          if (Date.now() - lastDragEnd < 350) return
          return openSheet('bead', bead.dataset.bead)
        }
        const node = e.target.closest('[data-node]')
        if (node) return openSheet('node', node.dataset.node)
        // The revert button, the checkbox, and the file-menu button (in the diff
        // sheet's own header) all live inside a row that opens a diff on any
        // other click — each has to claim its own press before that row-level
        // handler ever sees it.
        const revertBtn = e.target.closest('[data-revert]')
        if (revertBtn) return openRevertConfirm(revertBtn)
        if (e.target.closest('.wt-checkbox')) return
        const fileMenuBtn = e.target.closest('[data-filemenu]')
        if (fileMenuBtn) return openFileMenu(fileMenuBtn)
        // Lives inside <summary> like the push button before it, so a press has
        // to stop the native fold the same way that one does.
        const commitToggle = e.target.closest('[data-commit-toggle]')
        if (commitToggle) {
          e.preventDefault()
          return $('commitPop').hidden ? openCommitCompose(commitToggle) : closeCommitCompose()
        }
        const wtRow = e.target.closest('[data-diff]')
        if (wtRow) return openSheet('diff', wtRow.dataset.diff)
        if (e.target.closest('#scrim, #sheetClose, [data-close-sheet]')) closeSheet()
      })

      /* Row keyboard support piggybacks on click's own dispatch: it needs the same
         guards against the checkbox and the revert button that click already has,
         so this doesn't reimplement them — it just makes Enter/Space open one. */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        const row = e.target.closest?.('[data-diff]')
        if (!row || row !== e.target) return
        e.preventDefault()
        openSheet('diff', row.dataset.diff)
      })

      /* A repaint rebuilds the board from innerHTML, which drops the focused
      node — so a toggle hands focus back to the row it just rebuilt. */
      const cardSection = (el) => el.closest('[data-lane]')?.dataset.lane || 'backlog'
      function refocusCard(id, section) {
        const container = section === 'backlog' ? '#backlogStrip' : `[data-lane="${CSS.escape(section)}"]`
        document.querySelector(`${container} .card[data-bead="${CSS.escape(id)}"]`)?.focus({preventScroll: true})
      }

      /* A focused parent expands with → and folds with ←. The caret is a span
      rather than a second tab stop, so the card toggles its own subtree
      without the focus ever leaving the row. */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return
        const card = e.target.closest?.('.card[data-has-kids]')
        if (!card || card !== e.target) return
        e.preventDefault()
        const id = card.dataset.bead
        const section = cardSection(card)
        if (e.key === 'ArrowRight') expandedEpics.add(id)
        else expandedEpics.delete(id)
        paintNow()
        requestAnimationFrame(() => refocusCard(id, section))
      })

      /* `toggle` doesn't bubble, so it's caught on the way down. Folding is the
         reader's, not the ledger's: it survives every repaint until they say
         otherwise. */
      document.addEventListener(
        'toggle',
        (e) => {
          const lane = e.target.closest?.('[data-lane]')
          if (!lane) return
          lane.open ? foldedLanes.delete(lane.dataset.lane) : foldedLanes.add(lane.dataset.lane)
        },
        true,
      )

      /* The composer writes through to `draft` on every keystroke, so a repaint
         rebuilds the same words, and the sheet's title writes through to
         `pendingEdit` the same way. Suggestions update the dropdown in place —
         a repaint here would move focus after every letter. */
      document.addEventListener('input', (e) => {
        if (e.target.id === 'composerTitle') draft.title = e.target.value
        else if (e.target.id === 'composerDesc') draft.description = e.target.value
        else if (e.target.id === 'editTitle') {
          if (subject && subject.kind === 'bead') pendingEdit.id = subject.id
          pendingEdit.title = e.target.value
        } else if (e.target.id === 'closeReason') {
          if (subject && subject.kind === 'bead') pendingEdit.id = subject.id
          pendingEdit.reason = e.target.value
        } else if (e.target.id === 'composerLabels') {
          draft.labels = e.target.value
          renderSuggestions(e.target)
        }
      })
      document.addEventListener('focusin', (e) => {
        if (e.target.id === 'composerLabels') renderSuggestions(e.target)
      })

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return
        closeTitleMenu()
        closeRevertConfirm()
        closeFileMenu()
        closeCommitCompose()
        // Suggestions own the first Escape while open — the draft behind them
        // stays, and the composer it belongs to stays with it.
        const suggestionsOpen = composerOpen && $('composerSuggest') && !$('composerSuggest').hidden
        hideSuggestions()
        // A sheet on top owns the press; the composer behind it stays as it was.
        if (composerOpen && !subject && !suggestionsOpen) cancelComposer()
        if (subject) closeSheet()
      })

      /* The composer's own keys. The priority radiogroup answers arrows, Home
      and End like a native radio group; the label field answers up/down by
      arming a suggestion and Enter by picking the armed one. Escape is owned
      by the handler above. */
      document.addEventListener('keydown', (e) => {
        const radio = e.target.closest?.('[data-prio]')
        if (
          radio &&
          ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)
        ) {
          e.preventDefault()
          const order = [...document.querySelectorAll('#composer .seg [data-prio]')]
          if (!order.length) return
          let ix = order.indexOf(radio)
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') ix = (ix + 1) % order.length
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')
            ix = (ix - 1 + order.length) % order.length
          else if (e.key === 'Home') ix = 0
          else ix = order.length - 1
          setPriority(+order[ix].dataset.prio, true)
          return
        }
        // The sheet's priority group answers the same keys as the composer's.
        const editRadio = e.target.closest?.('[data-edit-prio]')
        if (
          editRadio &&
          ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)
        ) {
          e.preventDefault()
          const order = [...document.querySelectorAll('#sheetBody .seg [data-edit-prio]')]
          if (!order.length) return
          let ix = order.indexOf(editRadio)
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') ix = (ix + 1) % order.length
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')
            ix = (ix - 1 + order.length) % order.length
          else if (e.key === 'Home') ix = 0
          else ix = order.length - 1
          setEditPrio(order[ix])
          order[ix].focus()
          return
        }
        if (
          e.target.id === 'composerLabels' &&
          ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)
        ) {
          const box = $('composerSuggest')
          const opts = box && !box.hidden ? [...box.querySelectorAll('[role="option"]')] : []
          if (!opts.length) return
          if (e.key === 'Enter') {
            const armed = opts[suggestActive]
            // Nothing armed is nothing to confirm — the field keeps its text.
            if (!armed) return
            e.preventDefault()
            pickSuggestion(armed.dataset.suggest)
            return
          }
          e.preventDefault()
          suggestActive =
            e.key === 'ArrowDown'
              ? Math.min(suggestActive + 1, opts.length - 1)
              : suggestActive <= 0
                ? opts.length - 1
                : suggestActive - 1
          markSuggestionActive(e.target)
        }
      })

      /* ---- work tree interactions --------------------------------------------- */
      /* A checkbox's own change fires after click already ran and let it through
         (the click handler above returns early on `.wt-checkbox` rather than
         opening a diff), so staging is wired here instead of there. */
      document.addEventListener('change', (e) => {
        if (!e.target.matches('.wt-checkbox')) return
        const path = e.target.dataset.stage
        const staged = e.target.checked
        e.target.disabled = true
        fetch('worktree/' + (staged ? 'stage' : 'unstage'), {method: 'POST', body: JSON.stringify({path})})
          .then(() => {
            // Whichever side of the index the file is on now, the diff for it just
            // changed — a stale cached one would show the wrong half of the edit.
            delete diffCache[path]
            if (subject && subject.kind === 'diff' && subject.id === path) hydrateDiff(path)
            return tick()
          })
          .finally(() => (e.target.disabled = false))
      })

      /* The revert and file-action popovers are single fixed elements repositioned
         over whichever row was pressed, rather than one per row — rows are thrown
         away and rebuilt on every poll, and a popover that lived inside one would
         vanish out from under a reader mid-decision. */
      let revertTarget = null

      // Anchored under the control that opened it, but nudged back onto the
      // screen when that control sits near an edge — the revert icon and the
      // commit button both live at the far right of their rows, and either can
      // sit close enough to the bottom that a popover opening below it (the
      // commit compose is tall enough, with its textarea, to do this often)

      // would render partly off-screen with nothing to scroll it into view.
      function placePopover(pop, box, width) {
        pop.style.left = `${Math.round(Math.min(box.left, innerWidth - width - 12))}px`
        const height = pop.getBoundingClientRect().height
        const fitsBelow = box.bottom + 6 + height <= innerHeight - 12
        const top = fitsBelow ? box.bottom + 6 : Math.max(12, box.top - height - 6)
        pop.style.top = `${Math.round(top)}px`
      }

      function openRevertConfirm(btn) {
        closeFileMenu()
        revertTarget = btn.dataset.revert
        $('revertConfirmName').textContent = revertTarget
        const pop = $('revertConfirm')
        pop.hidden = false
        placePopover(pop, btn.getBoundingClientRect(), 220)
      }

      function closeRevertConfirm() {
        $('revertConfirm').hidden = true
        revertTarget = null
      }

      $('revertCancel').addEventListener('click', closeRevertConfirm)
      $('revertConfirmBtn').addEventListener('click', () => {
        if (!revertTarget) return
        const path = revertTarget
        closeRevertConfirm()
        fetch('worktree/revert', {method: 'POST', body: JSON.stringify({path})}).then(() => {
          delete diffCache[path]
          // The row it belonged to is gone — reverting is what a diff sheet's own
          // checkbox can trigger, and the sheet has nothing left to show.
          if (subject && subject.kind === 'diff' && subject.id === path) closeSheet()
          return tick()
        })
      })

      let fileMenuTarget = null

      function openFileMenu(btn) {
        closeRevertConfirm()
        fileMenuTarget = btn.dataset.filemenu
        const pop = $('fileMenu')
        pop.hidden = false
        placePopover(pop, btn.getBoundingClientRect(), 200)
      }

      function closeFileMenu() {
        $('fileMenu').hidden = true
        fileMenuTarget = null
      }

      $('fileMenuReveal').addEventListener('click', () => {
        if (!fileMenuTarget) return
        fetch('worktree/reveal', {method: 'POST', body: JSON.stringify({path: fileMenuTarget})})
        closeFileMenu()
      })
      $('fileMenuVscode').addEventListener('click', () => {
        if (!fileMenuTarget) return
        fetch('worktree/vscode', {method: 'POST', body: JSON.stringify({path: fileMenuTarget})})
        closeFileMenu()
      })

      /* ---- commit compose ------------------------------------------------------ */
      function autoGrowTextarea(el) {
        el.style.height = 'auto'
        el.style.height = `${el.scrollHeight}px`
      }
      $('commitMsg').addEventListener('input', (e) => autoGrowTextarea(e.target))

      // Read by `worktreeLane` so the toggle button still renders pressed after
      // a board repaint regenerates it from scratch — the DOM attribute set
      // below is only the instant feedback, not the source of truth.
      let commitComposeOpen = false

      function openCommitCompose(btn) {
        closeRevertConfirm()
        closeFileMenu()
        commitComposeOpen = true
        const pop = $('commitPop')
        pop.hidden = false
        placePopover(pop, btn.getBoundingClientRect(), 450)
        btn.setAttribute('aria-expanded', 'true')
        const ta = $('commitMsg')
        requestAnimationFrame(() => {
          ta.focus()
          autoGrowTextarea(ta)
        })
      }

      function closeCommitCompose() {
        commitComposeOpen = false
        $('commitPop').hidden = true
      }

      // A click anywhere else is a dismissal — these three are the only popovers
      // that open on a press rather than a hover, so they're the only ones that
      // need to catch a press that lands somewhere else.
      document.addEventListener('click', (e) => {
        if (!$('revertConfirm').hidden && !e.target.closest('#revertConfirm, [data-revert]')) closeRevertConfirm()
        if (!$('fileMenu').hidden && !e.target.closest('#fileMenu, [data-filemenu]')) closeFileMenu()
        if (!$('commitPop').hidden && !e.target.closest('#commitPop, [data-commit-toggle]')) closeCommitCompose()
        // The composer stays — typed text must not evaporate on a stray press —
        // but its suggestions are just a hint and go away like any popover.
        if (composerOpen && !e.target.closest('#composer, [data-add-bead]')) hideSuggestions()
      })

      $('commitSubmit').addEventListener('click', async () => {
        const message = $('commitMsg').value
        const amend = $('commitAmend').checked
        const btn = $('commitSubmit')
        const err = $('commitError')
        btn.disabled = true
        err.hidden = true
        try {
          const r = await (
            await fetch('worktree/commit', {method: 'POST', body: JSON.stringify({message, amend})})
          ).json()
          if (r.ok) {
            $('commitMsg').value = ''
            $('commitAmend').checked = false
            autoGrowTextarea($('commitMsg'))
            closeCommitCompose()
            tick()
          } else {
            err.textContent = r.error || 'commit failed'
            err.hidden = false
          }
        } catch {
          err.textContent = "nothing is serving this page, so the commit didn't go through"
          err.hidden = false
        } finally {
          btn.disabled = false
        }
      })

      /* ---- run controls ----------------------------------------------------- */
      /* The header carries the ones that put the app in front of you — whatever
         dashboard.toml places there. Running the gate belongs with
         the word that reports it, so it sits in the gate's own pane instead, and
         the gate's note is what those runs last said. */
      let runsSignature = ''
      let lastRunNote = ''

      function drawRuns() {
        const signature = Object.keys(runStates)
          .map((k) => `${k}:${runStates[k].state}`)
          .join('|')
        if (signature !== runsSignature) {
          runsSignature = signature
          $('runs').innerHTML = runSlot('header')
        }

        // Named by key rather than by label: the button in the gate says "run",
        // but a note under it has to say which run it is reporting.
        const last = Object.entries(runStates)
          .filter(([, r]) => r.where === 'gate' && r.state !== 'idle' && r.output)
          .sort((a, b) => (b[1].at || 0) - (a[1].at || 0))[0]
        lastRunNote = last ? `${last[0]}: ${last[1].output} · ${last[1].ago}` : ''
      }

      /* ---- the popovers ----------------------------------------------------- */
      /* The gate is one word in the header. Green means what's on disk has been
         proven; anything else is the number of commits nobody has checked.
         No verify logs means no gate at all — except that a gate-placed run
         button is how logs come to exist, so the gate stays while one is
         configured. */
      function gateVisible(d) {
        const v = d.verify || {}
        if (v.status && v.status !== 'never run') return true
        return Object.values(runStates).some((r) => r.where === 'gate')
      }

      function drawGate(d) {
        const v = d.verify || {status: 'never run'}
        // A section the project hid stays hid, whatever the gate reports.
        $('gate').hidden = !gateVisible(d) || boardConfig(d).hidden.has('gate')
        // The dot before the gate separates it from the branch; a hidden gate
        // leaves a doubled separator.
        const dot = $('gate').previousElementSibling
        if (dot && dot.classList.contains('dot')) dot.hidden = $('gate').hidden
        if ($('gate').hidden) return
        $('gateLabel').textContent =
          v.status === 'passed' ? 'verified' : v.status === 'failed' ? 'failing' : 'unverified'
        $('gate').className = 'gate hoverable ' + (v.status === 'passed' ? 'good' : v.status === 'failed' ? 'bad' : '')
      }

      /* ---- the deploy chip ---------------------------------------------------- */
      /* One word in the header, only while the project is Vercel-linked: green
         means production is the push, anything else names where the push is.
         Unlinked boards carry no d.vercel, so the chip and its dot stay hid
         and the header reads exactly as before. */
      let deploySignature = ''
      function drawDeploy(d) {
        const v = d.vercel
        const show = !!v
        $('deploy').hidden = !show
        // The dot before the chip separates it from the pulse; a hidden chip
        // leaves a doubled separator (see drawGate).
        const dot = $('deploy').previousElementSibling
        if (dot && dot.classList.contains('dot')) dot.hidden = !show
        if (!show) return
        const LABEL = {deployed: 'deployed', deploying: 'deploying', behind: 'behind', failed: 'failed', unreachable: 'unreachable'}
        const WHY = {token: 'no token', link: 'not linked', upstream: 'no upstream'}
        $('deployLabel').textContent = !v.configured ? WHY[v.why] || 'off' : LABEL[v.status] || 'unreachable'
        $('deploy').className =
          'gate hoverable ' + (v.status === 'deployed' ? 'good' : v.status === 'failed' || v.status === 'unreachable' ? 'bad' : '')
        // The tip rebuilds wholesale, so an unchanged tip is left alone — the
        // signature covers everything drawn, so a status change repaints.
        const signature = JSON.stringify(v)
        if (signature === deploySignature) return
        deploySignature = signature
        const tip = $('deployTip')
        if (!tip) return
        if (!v.configured) {
          tip.innerHTML =
            `<h3>deploy</h3>` +
            (v.why === 'link'
              ? `<div class="note"><code>.vercel/project.json</code> is missing — run
                 <code>vercel link</code> once (per machine, gitignored).</div>`
              : v.why === 'upstream'
                ? `<div class="note"><code>origin/main</code> doesn't resolve here yet — fetch once.</div>`
                : `<div class="note">Needs a token: create one at
                   <code>vercel.com/account/tokens</code> and add
                   <code>VERCEL_API_TOKEN=…</code> to <code>.env.local</code>.
                   It lights up within a minute, no restart.</div>`)
          return
        }
        const stateNote =
          v.status === 'deployed'
            ? `<div class="note">Production is this push.</div>`
            : v.status === 'deploying'
              ? `<div class="note">Vercel picked up the push and is building it.</div>`
              : v.status === 'behind'
                ? `<div class="note">No deployment for this push yet — Vercel hasn't picked it up.</div>`
                : v.status === 'failed'
                  ? `<div class="note">The newest deployment for this push failed or was canceled.</div>`
                  : `<div class="note">Vercel didn't answer${v.error ? `: ${esc(v.error)}` : ''}.</div>`
        tip.innerHTML =
          `<h3>deploy</h3>` +
          row('origin/main', v.head || '—') +
          (v.sha ? row('deployment', `${v.sha} · ${v.state || ''}`, v.status === 'deployed' ? 'ok' : v.status === 'failed' ? 'bad' : 'warn') : '') +
          (v.url ? row('url', v.url) : '') +
          (v.when ? row('created', v.when) : '') +
          stateNote
      }

      let verifySignature = ''
      // The detected harness boards — drawn as the tab bar at the top of the
      // title popover. Empty until the first dashboards poll lands. selfRoot
      // names this board: the endpoint answers {self, peers}, and a peer is
      // current when its root matches.
      let peers = []
      let selfRoot = ''
      let metaSignature = ''
      // The peer currently switching (see switchPeer): its root, so the
      // signature below keeps the busy segment across polls instead of a
      // repaint restoring the old label mid-flight.
      let startingPeerRoot = ''

      function drawVerify(d) {
        const tip = $('verifyTip')
        if (!tip || !gateVisible(d)) return
        const v = d.verify || {status: 'never run'}
        const cls = v.status === 'passed' ? 'ok' : v.status === 'failed' ? 'bad' : ''
        // The pane holds a button now, so it can't be rebuilt on every poll — the
        // press would land on an element that had already been replaced under it.
        const button = runSlot('gate')
        const signature = JSON.stringify([v, lastRunNote, button, d.git.branch])
        if (signature === verifySignature) return
        verifySignature = signature
        tip.innerHTML =
          `<h3>the gate${button}</h3>` +
          (lastRunNote ? `<div class="run-note">${esc(lastRunNote)}</div>` : '') +
          row('last run', v.status + (v.when ? ' · ' + v.when : ''), cls) +
          v.steps.map((s) => row(s.name, s.ok ? 'ok' : 'failed', s.ok ? 'ok' : 'bad')).join('') +
          (v.tests ? row('suite', v.tests) : '') +
          (v.took ? row('took', v.took) : '') +
          row('branch', d.git.branch) +
          ((v.unverified || []).length
            ? `<h3 style="margin-top:12px">landed since</h3>` +
              v.unverified
                .map(
                  (c) =>
                    `<div class="note" style="margin-top:4px"><code>${esc(c.sha)}</code>
                     ${esc(c.subject)}</div>`,
                )
                .join('') +
              `<div class="note">Counted as commits, not beads — a commit that names
                   no bead has no card in the commit lane.</div>`
            : `<div class="note">scripts/verify.sh — build, tests, and a smoke check
                 behind one exit code.</div>`)
      }

      function drawReview(d) {
        const tip = $('reviewTip')
        if (!tip) return
        tip.innerHTML =
          `<h3>reviewers</h3>` +
          d.agents.map((a) => row(a.name, a.model, 'warn')).join('') +
          `<div class="note">scripts/review.sh bundles the diff once; both agents read
             that packet rather than the repo. Move a bead here with
             <code>bd label add &lt;id&gt; review</code>.</div>`
      }

      function drawCommit(d) {
        const tip = $('commitTip')
        if (!tip) return
        const g = d.git
        tip.innerHTML =
          `<h3>committing</h3>` +
          row('uncommitted files', g.dirty, g.dirty ? 'warn' : 'ok') +
          row('unpushed commits', (g.unpushed || []).length, (g.unpushed || []).length ? 'warn' : 'ok') +
          row('tracking', g.upstream || 'no upstream', g.upstream ? '' : 'warn') +
          row('last commit', `${g.last.sha} · ${g.last.when}`) +
          `<div class="note">A bead lands here when an unpushed commit names it —
             finished on this machine, nowhere else.</div>`
      }

      /* One segment per detected harness, the current board pressed and inert:
         a press switches this same page to the peer (see switchPeer). With no peer list yet — a lone board, or
         a server from before the dashboards endpoint — the bar is just this
         board. `p.self` is only ever set on that local fallback; listed peers
         compare roots against the endpoint's `self`. */
      function peerGroup(d) {
        // A section the project hid never renders, even while switching —
        // the in-flight label lives on the tab being hidden.
        if (boardConfig(d).hidden.has('peers')) return ''
        // Foreign entries make the whole list absent, not dead tabs — and a
        // lone board simply arrives as a list of one.
        const shaped = (p) =>
          p && typeof p.root === 'string' && p.root !== '' && typeof p.name === 'string'
        const known = peers.filter(shaped)
        const list = known.length ? known : [{name: d.project, root: '', self: true}]
        const buttons = list
          .map((p) => {
            // The in-flight tab first, so no current check below can steal
            // its busy state: it keeps its root and its name — the row doesn't
            // reflow mid-flight — and carries the busy treatment until the
            // board on screen is actually the one it names (see switchPeer).
            const starting = startingPeerRoot && p.root === startingPeerRoot
            if (starting)
              return (
                `<button aria-checked="false" aria-disabled="true" aria-busy="true"` +
                ` data-peer-root="${esc(p.root)}" title="${esc(p.root)}">${esc(p.name)}</button>`
              )
            // Current is the board on screen. The `self` flag is only ever set
            // on the local lone-board fallback above — a listed entry carrying
            // one must not out-rank the endpoint's own root.
            const self = (p.self && !p.root) || (selfRoot && p.root === selfRoot)
            if (self)
              return (
                `<button aria-checked="true" aria-disabled="true"` +
                `${p.root ? ` title="${esc(p.root)}"` : ''}>${esc(p.name)}</button>`
              )
            // A board from before the switch speaks only `start`: landing there
            // would strand the tab bar with no way back, so its tab is inert
            // and says it needs an update. Older endpoints omit the flag —
            // their peers stay usable.
            const incapable = p.switch_capable === false
            const disabled = startingPeerRoot || incapable
            const title = incapable
              ? `${p.root} — this board needs an update before it can switch`
              : p.root
            // While a switch is in flight every other tab is inert too:
            // presses there are swallowed by the single-flight guard, so the
            // row must not advertise pressable. Only the switching tab is
            // dimmed — the dim is its busy message.
            return (
              `<button aria-checked="false"${disabled ? ' aria-disabled="true"' : ''}` +
              `${incapable ? ' data-peer-incapable="true"' : ` data-peer-root="${esc(p.root)}"`}` +
              ` title="${esc(title)}">${esc(p.name)}</button>`
            )
          })
          .join('')
        return (
          `<div class="group peer-group">` +
          `<div class="peer-scroll" id="peerScroll">` +
          `<button class="peer-scroll-control" type="button" data-peer-scroll="-1" aria-label="Scroll boards left" hidden>‹</button>` +
          `<div class="seg peer-seg" id="peerSeg" role="listbox" aria-label="dashboards">${buttons}</div>` +
          `<button class="peer-scroll-control" type="button" data-peer-scroll="1" aria-label="Scroll boards right" hidden>›</button>` +
          `</div></div>`
        )
      }

      function updatePeerScroll() {
        const seg = $('peerSeg')
        const wrap = $('peerScroll')
        if (!seg || !wrap) return
        const controls = [...wrap.querySelectorAll('[data-peer-scroll]')]
        const overflowing = seg.scrollWidth > seg.clientWidth + 1
        for (const control of controls) control.hidden = !overflowing
        wrap.classList.toggle('has-more', overflowing && seg.scrollLeft + seg.clientWidth < seg.scrollWidth - 1)
        if (!seg.onscroll) seg.onscroll = updatePeerScroll
      }
      window.addEventListener('resize', updatePeerScroll)

      function drawMeta(d) {
        const b = d.budget
        const onDemand = b.on_demand.reduce((n, x) => n + x.tokens, 0)
        const total = b.always_total + onDemand
        const pct = (n) => ((100 * n) / total).toFixed(1) + '%'

        // The popover rebuilds wholesale, which drops the focus of anyone
        // tabbing through the peer tabs — so an unchanged popover is left
        // alone. On the peer slice the signature covers what is drawn and
        // nothing more — the tab bar's names and roots (not the endpoint's
        // live/port churn), the in-flight start, and the project and root the
        // tabs read — plus the popover's own data below, as always.
        const signature = JSON.stringify([peers.map((p) => [p.name, p.root, p.switch_capable]), startingPeerRoot, selfRoot, d.project, d.root, b, d.ledger, d.skills, d.agents, d.git.commits_today, d.board])
        if (signature === metaSignature) return
        metaSignature = signature

        // A section the project hid never renders, even with numbers on it.
        const showBudget = !boardConfig(d).hidden.has('budget')
        $('metaTip').innerHTML =
          peerGroup(d) + (showBudget ? `
           <div class="group">
             <h3>context budget</h3>
            <div class="bar">
              <span style="width:${pct(b.always_total)};background:var(--warn)"></span>
              <span style="width:${pct(onDemand)};background:var(--accent);opacity:.45"></span>
            </div>
            <div class="legend">
              <span><i style="background:var(--warn)"></i>${b.always_total} every session</span>
              <span><i style="background:var(--accent);opacity:.45"></i>${onDemand} on demand</span>
            </div>
            ${b.always.map((a) => row(a.name, a.tokens)).join('')}
            <div class="note save">The session brief costs <b>${b.brief_tokens} tokens</b> where
              <code>bd prime</code> cost ~${b.prime_tokens} — <b>${b.prime_tokens - b.brief_tokens}
              saved</b> on every session, not just the first.</div>
          </div>` : ``) + `
          <div class="group">
            <h3>ledger health</h3>
            ${row('ready to claim', d.ledger.counts.ready, d.ledger.counts.ready ? '' : 'warn')}
            ${row('stale (14d+)', d.ledger.stale ?? 0, d.ledger.stale ? 'warn' : '')}
            ${row('commits today', d.git.commits_today)}
            <div class="note">Work that stops moving is the failure a solo loop can't
              see. Nothing ready means the next session has nothing to pick up.</div>
          </div>
          <div class="group">
            <h3>capabilities</h3>
            ${d.skills.map((s) => row(s.name, `${s.idle} idle · ${s.loaded} loaded`)).join('')}
            ${d.agents.map((a) => row(a.name, a.model, 'warn')).join('')}
            <div class="note">Skills cost their description until invoked. Reviewers run on
              cheap models, off the diff.</div>
          </div>`
        updatePeerScroll()
      }

      /* ---- polling ---------------------------------------------------------- */
      function draw(d) {
        // Before anything else: every run button on the page reads this.
        runStates = d.runs || {}
        drawRuns()
        // Project theming and assets ride the same repaint as the board, read
        // from the state rather than cached — an empty config is today's board.
        applyTheme(d.theme)
        loadAssets(d.assets)
        drawBoard(d)
        drawBacklog(d)
        drawHarness(d)
        orderPageSections(boardConfig(d).order)
        refreshSheet()
        drawVerify(d)
        drawReview(d)
        drawCommit(d)
        drawMeta(d)
        $('branchline').textContent = `${(d.git || {}).branch || '—'} · ${(((d.ledger || {}).counts || {}).open ?? 0)} open`
        document.title = `${d.project} · harness`
        $('projectName').textContent = d.project
        drawGate(d)
        drawDeploy(d)
      }

      /* Monotonic draw generation: polls overlap and the switch's repaint can
         land while an older tick is still awaiting its fetches — a tick whose
         data predates a newer one must never paint its stale board over the
         new one, which is exactly when a late tick arrives (just after a
         switch). */
      let drawGen = 0
      let statePoll = null
      let peerPoll = null

      function cancelStatePoll() {
        if (!statePoll) return
        statePoll.controller.abort()
        statePoll = null
      }

      function cancelPeerPoll() {
        if (!peerPoll) return
        peerPoll.controller.abort()
        peerPoll = null
      }

      // Peer discovery decorates a state that already painted. One bounded
      // request at a time; a newer poll or a switch makes its result obsolete.
      async function pollPeers(d) {
        if (peerPoll || startingPeerRoot) return
        const flight = {controller: new AbortController()}
        peerPoll = flight
        let timeout
        let next = []
        let nextSelf = null
        try {
          const res = await Promise.race([
            fetch('dashboards?t=' + Date.now(), {cache: 'no-store', signal: flight.controller.signal})
              .then((r) => r.json()),
            new Promise((_, reject) => {
              timeout = setTimeout(() => {
                flight.controller.abort()
                reject(new Error('peer discovery timed out'))
              }, 2000)
            }),
          ])
          // Only the endpoint's own shape is accepted — anything else is a
          // regression to hear about, not a shape to guess at.
          const shaped = (p) =>
            p && typeof p.root === 'string' && p.root !== '' && typeof p.name === 'string'
          next = res && Array.isArray(res.peers) && res.peers.every(shaped) ? res.peers : []
          nextSelf = res && typeof res.self === 'string' ? res.self : null
        } catch {
          // An absent or slow optional endpoint leaves the current board's tab.
        } finally {
          clearTimeout(timeout)
          if (peerPoll === flight) peerPoll = null
        }
        // Ordinary state polls do not make peer discovery stale. Only a root
        // change or an active switch does; render the latest state if it did
        // advance while this bounded request was in flight. The endpoint's
        // self moves with a switch, so it lands here too — never from a
        // response that arrived too late to paint.
        if (startingPeerRoot || lastLedger?.root !== d.root) return
        peers = next
        if (nextSelf !== null) selfRoot = nextSelf
        drawMeta(lastLedger || d)
      }

      /* A dropped poll and a broken repaint are different failures and are caught
         apart. They used to share one try: a fetch that didn't come back jumped
         past every draw, so the pulse read offline while the board silently held
         whatever it last painted — which is what "the dashboard stopped showing
         new beads" looks like from the outside. The connection is the pulse's
         business. The board keeps showing the last state that arrived, because a
         few seconds stale is still the truest picture anyone has. */
      async function tick() {
        // Interval ticks never invalidate an in-flight request. The owning
        // poll paints when it returns; only an explicit switch cancels it.
        if (statePoll || startingPeerRoot) return
        const gen = ++drawGen
        const flight = {controller: new AbortController()}
        statePoll = flight
        let d
        let timeout
        try {
          const response = await Promise.race([
            fetch('state.json?t=' + Date.now(), {cache: 'no-store', signal: flight.controller.signal}),
            new Promise((_, reject) => {
              timeout = setTimeout(() => {
                flight.controller.abort()
                reject(new Error('state poll timed out'))
              }, 10000)
            }),
          ])
          d = await response.json()
        } catch (e) {
          if (statePoll !== flight || gen !== drawGen) return
          statePoll = null
          $('pulse').className = 'pulse stale'
          $('pulseLabel').textContent = 'offline'
          $('pulseTip').innerHTML =
            `<h3>offline</h3>` +
            `<div class="note">The last poll didn't come back. ${
              lastLedger
                ? 'The board is the last state that did.'
                : 'Nothing has arrived yet.'
            } If this stays, start the server with
            <code>scripts/dashboard.py</code>.</div>`
          return
        } finally {
          clearTimeout(timeout)
        }

        if (statePoll !== flight || gen !== drawGen) return
        statePoll = null
        if (startingPeerRoot && d.root !== startingPeerRoot) return
        try {
          draw(d)
        } catch (e) {
          // The state arrived; the page couldn't paint it. That's a bug here, not
          // a server that stopped answering, and saying "offline" would send
          // whoever reads this looking in the wrong place.
          $('pulse').className = 'pulse stale'
          $('pulseLabel').textContent = 'draw failed'
          $('pulseTip').innerHTML =
            `<h3>draw failed</h3>` +
            `<div class="note">The state arrived but the page could not paint it:
             <code>${esc(String(e))}</code></div>`
          return
        }

        document.documentElement.setAttribute('data-board-ready', 'true')
        $('pulse').className = 'pulse'
        $('pulseLabel').textContent = 'live'
        $('pulseTip').innerHTML =
          `<h3>live</h3>` +
          row('last read', d.generated) +
          row('polling', 'every 2.5s') +
          `<div class="note">Read from bd and git by
             <code>scripts/dashboard.py</code>, which rebuilds on a thread of its
             own. Every poll after the first is handed the last snapshot it
             finished, rather than waiting for a new one.</div>`
        void pollPeers(d)
      }
      /* Pane placement is measured, not guessed. Which lane sits nearest an edge
         changes with the wrap, so a nth-child rule was always going to be wrong on
         some layout; this nudges whichever pane is about to open back inside the
         viewport. */
      function keepInView(anchor) {
        const tip = anchor.querySelector(':scope > .tip')
        if (!tip) return
        tip.style.marginLeft = '0px'
        const box = tip.getBoundingClientRect()
        const edge = 12
        let dx = 0
        if (box.right > innerWidth - edge) dx = innerWidth - edge - box.right
        if (box.left + dx < edge) dx = edge - box.left
        tip.style.marginLeft = `${Math.round(dx)}px`
      }

      for (const event of ['pointerenter', 'focusin']) {
        document.addEventListener(
          event,
          (e) => {
            const anchor = e.target.closest?.('.gate, .pulse, .lane-name.hoverable')
            if (anchor) keepInView(anchor)
          },
          true,
        )
      }

      /* Below the polling line, so the frozen artifact drops it: without a server
         these would be dead controls, and one that looks live and isn't is worse
         than none. */
      document.addEventListener('click', (e) => {
        const button = e.target.closest('[data-task]')
        if (!button) return
        // `push` sits in a lane's summary, where a plain click would also fold the
        // lane out from under the reader.
        e.preventDefault()
        // Answer the press on this frame rather than waiting out the poll: mark it
        // running in the state every run button is drawn from, then redraw this one
        // from it, so it picks up the table's own busy label and loses its old one.
        const key = button.dataset.task
        runStates[key].state = 'running'
        button.outerHTML = runButton(key)
        fetch('run/' + key, {method: 'POST'}).then(tick)
      })

      tick()
      setInterval(tick, 2500)

      /* ---- capture states ------------------------------------------------- */
      /* `dashboard.py shot <state>` photographs hover and focus content that
         headless Chrome can never trigger on its own — it captures the page as
         it loads. The state rides in as ?shot=<name>: after the first poll
         paints, the matching action below opens the same UI a hover or a press
         would, and a hold-open keeps the CSS-only tips up for the capture (see
         the capture rule beside the :hover ones): a data-shot attribute on the
         document for gate and pulse, whose classes polls rebuild, a .shot
         class on the lane for review and staging, whose markup only rebuilds
         on change. Nothing here runs without the query param, so the live
         page never notices it. */
      const SHOT = new URLSearchParams(location.search).get('shot')
      if (SHOT) {
        // Marked at once, for every name: the transition freeze above keys off
        // this attribute, so it has to hold from the first paint, not from when
        // the matching action below runs.
        document.documentElement.setAttribute('data-shot', SHOT)
        const SHOT_ACTIONS = {
          // On the document, not the node: drawGate and the poll both rebuild
          // those classes on every pass, which would wipe a class holding the
          // tip open before the capture lands.
          gate: () => document.documentElement.setAttribute('data-shot', 'gate'),
          pulse: () => document.documentElement.setAttribute('data-shot', 'pulse'),
          review: () => document.getElementById('reviewTip')?.closest('.lane-name')?.classList.add('shot'),
          staging: () => document.getElementById('commitTip')?.closest('.lane-name')?.classList.add('shot'),
          // Click-driven UI is opened with a real press rather than a class.
          // The composer toggles off a lane button; the file menu hangs off a
          // diff sheet's header, so that state opens the first changed file
          // first. Best effort: with a clean work tree there is nothing to
          // press, and the capture is the default view.
          commit: () => document.querySelector('[data-commit-toggle]')?.click(),
          filemenu: () => {
            const row = document.querySelector('[data-diff]')
            if (!row) return
            row.click()
            requestAnimationFrame(() =>
              requestAnimationFrame(() => document.querySelector('[data-filemenu]')?.click()),
            )
          },
          // The peer tabs live in the title popover, which only a press opens.
          peers: () => document.querySelector('#metaToggle')?.click(),
        }
        // After the first poll paints, so the nodes exist — applied
        // synchronously, because nothing the actions do needs a painted frame
        // and a double-rAF wait loses the race with headless capture. An
        // unknown name does nothing — the server already refused it, so a
        // hand-typed one just captures the default view.
        const shotWait = setInterval(() => {
          if (document.documentElement.getAttribute('data-board-ready') !== 'true') return
          clearInterval(shotWait)
          // SHOT is query-string input: dispatch only a real action, so a
          // prototype-chain name (?shot=__proto__) does nothing instead of
          // throwing and withholding data-shot-ready from the capture.
          const shotAction = Object.hasOwn(SHOT_ACTIONS, SHOT) ? SHOT_ACTIONS[SHOT] : undefined
          if (typeof shotAction === 'function') shotAction()
          document.documentElement.setAttribute('data-shot-ready', SHOT)
        }, 250)
      }
    </script>
  </body>
</html>
